  .workspace-heading h1 { font-size: clamp(40px, 12vw, 58px); }\n  .workspace-page .journey { margin-top: 42px; }\n  .workspace-split { grid-template-columns: 1fr; }\n  .chat-workspace, .circuit-panel { height: auto; min-height: 0; }\n  .chat-workspace { min-height: 620px; }\n  .circuit-panel { min-height: 500px; }\n  .conversation { padding: 20px 15px; }\n  .composer-prompts { display: flex; overflow-x: auto; padding-bottom: 3px; }\n  .composer-prompts button { flex: 0 0 145px; }\n  .composer-left-actions > span { display: none; }\n  .send-button { margin-left: auto; }\n  .count-row { grid-template-columns: 45px 1fr 48px; }\n  .backend-facts { grid-template-columns: 1fr 1fr; }\n  .backend-head { display: grid; }\n  .recommendation-badge { justify-self: start; }\n  .onboarding { width: calc(100% - 18px); max-height: calc(100% - 18px); overflow-y: auto; border-radius: 20px; }\n  .onboarding[data-active-step=\"ready\"] { width: calc(100% - 18px); }\n  .onboarding[data-active-step=\"basics\"] { width: calc(100% - 18px); }\n  .onboarding[data-active-step=\"basics\"] .onboarding-content { padding: 34px 18px 24px; }\n  .onboarding[data-active-step=\"ready\"] .onboarding-content { padding: 34px 18px 24px; }\n  .onboarding-content { padding: 34px 22px 26px; }\n  .onboarding h2 { font-size: 35px; }\n  #config-fields, .profile-options { grid-template-columns: 1fr; }\n  .concept-explorer { grid-template-columns: 1fr; min-height: 0; }\n  .concept-sidebar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 8px; }\n  .concept-sidebar > span { grid-column: 1 / -1; padding: 3px 4px 7px; }\n  .concept-sidebar button { min-height: 58px; padding: 7px 4px; display: grid; grid-template-columns: 1fr; grid-template-rows: auto auto; text-align: center; }\n  .concept-sidebar button b { grid-row: auto; font-size: 8px; }\n  .concept-sidebar button strong { font-size: 11px; white-space: nowrap; }\n  .concept-sidebar button[aria-current=\"step\"] { box-shadow: inset 0 -3px var(--lime); }\n  .concept-focus-card { min-height: 400px; padding: 17px 15px 14px; }\n  .concept-panel { padding: 19px 1px; }\n  .concept-panel h3 { font-size: 28px; }\n  .qubit-story-copy { grid-template-columns: 1fr; }\n  .qubit-story-copy section { min-height: 0; }\n  .concept-clarifier { display: grid; gap: 4px; }\n  .gate-picker { grid-template-columns: 1fr 1fr auto; }\n  .gate-picker > span { grid-column: 1 / -1; }\n  .gate-picker button { grid-template-columns: 1fr; gap: 2px; text-align: center; }\n  .gate-view-h { grid-template-columns: 82px 1fr 42px 1fr 52px 48px; }\n  .gate-view-cx { grid-template-columns: 82px 1fr 48px 1fr 68px; }\n  .single-gate-symbol { width: 40px; height: 44px; }\n  .single-measure { padding-inline: 4px; font-size: 7px; }\n  .single-cx { width: 48px; }\n  .single-output { min-width: 52px; padding-inline: 3px; font-size: 8px; }\n  .circuit-focus-flow { gap: 5px; }\n  .circuit-focus-flow > span { min-height: 80px; padding: 7px 3px; }\n  .measurement-focus-demo { grid-template-columns: 1fr; }\n  .measurement-focus-demo button { grid-row: auto; }\n  .measurement-circuit { padding-inline: 8px; grid-template-columns: 38px 1fr 42px 1fr 58px 47px; }\n  .measurement-circuit > strong { width: 36px; height: 38px; }\n  .measurement-circuit > em { padding-inline: 5px; font-size: 8px; }\n  .measurement-live-results > div { grid-template-columns: 56px 1fr 34px; }\n  .concept-focus-card > footer > span { display: none; }\n  .concept-focus-card > footer { justify-content: flex-end; }\n  .profile-card { min-height: 0; }\n  .profile-icon { margin-bottom: 12px; }\n  .dialog-actions { align-items: flex-end; }\n  .local-only { max-width: 120px; }\n  .lab-heading { display: block; }\n  .lab-reset { margin: 0 0 12px; }\n  .use-case p { display: grid; grid-template-columns: 1fr; }\n  .use-case small { grid-column: 1; }\n  .circuit-lab { grid-template-columns: 1fr; }\n  .circuit-canvas { min-height: 210px; grid-template-columns: 54px 1fr 56px 1fr 56px 1fr 62px; padding-inline: 10px; }\n  .gate { width: 46px; height: 46px; }\n  .gate span { transform: translateY(38px); font-size: 9px; }\n  .cx-gate { width: 56px; }\n  .measure-button { width: 58px; height: 46px; }\n  .measurement-results { grid-template-columns: 1fr; }\n  .ready-footer { align-items: flex-end; justify-content: space-between; }\n  .ready-footer > span { max-width: 160px; }\n}\n\n@media (min-width: 761px) and (max-width: 1040px) {\n  .workspace-split { grid-template-columns: 1fr; }\n  .chat-workspace, .circuit-panel { height: calc(100dvh - 28px); min-height: 680px; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }\n}\n\n<\/style>\n<\/head>\n<body>\n  <div class=\"ambient ambient-one\" aria-hidden=\"true\"><\/div>\n  <div class=\"ambient ambient-two\" aria-hidden=\"true\"><\/div>\n\n  <header class=\"topbar\">\n    <a class=\"brand\" href=\"/\" aria-label=\"LoomQ Agent 首页\">\n      <span class=\"brand-mark\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/span>\n      <span>LoomQ <b>Agent<\/b><\/span>\n    <\/a>\n    <div class=\"runtime-status\">\n      <span class=\"status-dot\" id=\"status-dot\" aria-hidden=\"true\"><\/span>\n      <span id=\"runtime-label\">正在检查运行环境…<\/span>\n      <button class=\"settings-button\" id=\"open-settings\" type=\"button\">运行设置<\/button>\n    <\/div>\n  <\/header>\n\n  <main>\n    <section class=\"hero\" id=\"welcome\">\n      <div class=\"eyebrow\"><span>无需 QASM 知识<\/span><span>无需平台黑话<\/span><\/div>\n      <h1>把你的想法，<br><em>变成一次量子实验。<\/em><\/h1>\n\n      <div class=\"portal-grid\" aria-label=\"LoomQ 功能入口\">\n        <button class=\"portal-card\" id=\"open-config\" type=\"button\">\n          <span class=\"portal-index\">01 · SETUP<\/span>\n          <span class=\"portal-symbol\" aria-hidden=\"true\">⌁<\/span>\n          <strong>运行配置<\/strong>\n          <small>检查模型地址、凭证、模型名称和请求超时。<\/small>\n          <span class=\"portal-action\">检查配置 →<\/span>\n        <\/button>\n        <button class=\"portal-card portal-guide\" id=\"open-guide\" type=\"button\">\n          <span class=\"portal-index\">02 · FIRST FLIGHT<\/span>\n          <span class=\"portal-symbol\" aria-hidden=\"true\">Q<\/span>\n          <strong>新手引导<\/strong>\n          <small>选择讲解深度，亲手运行第一个两比特电路。<\/small>\n          <span class=\"portal-action\">开始引导 →<\/span>\n        <\/button>\n        <a class=\"portal-card portal-workspace\" href=\"#workspace\" data-demo-workspace>\n          <span class=\"portal-index\">03 · WORKSPACE<\/span>\n          <span class=\"portal-symbol\" aria-hidden=\"true\">↗<\/span>\n          <strong>进入工作台<\/strong>\n          <small>设计、修改、解释和运行量子电路。<\/small>\n          <span class=\"portal-action\">打开新页面 →<\/span>\n        <\/a>\n      <\/div>\n    <\/section>\n  <\/main>\n\n  <dialog class=\"onboarding\" id=\"onboarding\" aria-labelledby=\"onboarding-title\">\n    <div class=\"onboarding-shell\">\n      <section class=\"onboarding-content\">\n        <button class=\"dialog-close\" id=\"close-onboarding\" type=\"button\" aria-label=\"关闭引导\">×<\/button>\n\n        <div class=\"onboarding-step\" data-step=\"config\">\n          <span class=\"step-label\">步骤 1 / 4 · 运行环境<\/span>\n          <h2 id=\"onboarding-title\">先连接你的模型<\/h2>\n          <p class=\"step-intro\">LoomQ 会自动检查四项本机配置。带绿色标记的项目已经就绪；API Key 不会显示或回传。<\/p>\n          <form id=\"config-form\" class=\"config-form\">\n            <div id=\"config-fields\"><\/div>\n            <p class=\"form-error\" id=\"config-error\" role=\"alert\"><\/p>\n            <div class=\"dialog-actions\">\n              <span class=\"local-only\">只写入本机 <code>.env.l2<\/code><\/span>\n              <button class=\"primary-action\" type=\"submit\">保存并继续 <span>→<\/span><\/button>\n            <\/div>\n          <\/form>\n        <\/div>\n\n        <div class=\"onboarding-step\" data-step=\"profile\" hidden>\n          <span class=\"step-label\">步骤 2 / 4 · 个性化<\/span>\n          <h2>你对量子计算熟悉吗？<\/h2>\n          <div class=\"profile-options\" role=\"radiogroup\" aria-label=\"量子知识背景\">\n            <button class=\"profile-card\" type=\"button\" data-profile=\"new\">\n              <span class=\"profile-icon\">○<\/span><strong>第一次接触<\/strong>\n              <small>默认开启基础概念与示例电路，从零开始<\/small>\n            <\/button>\n            <button class=\"profile-card\" type=\"button\" data-profile=\"some\">\n              <span class=\"profile-icon\">◐<\/span><strong>了解一些<\/strong>\n              <small>默认跳过基础概念，直接看示例电路<\/small>\n            <\/button>\n            <button class=\"profile-card\" type=\"button\" data-profile=\"expert\">\n              <span class=\"profile-icon\">●<\/span><strong>有量子背景<\/strong>\n              <small>默认跳过两个模块，直接进入工作台<\/small>\n            <\/button>\n          <\/div>\n          <div class=\"dialog-actions align-right\">\n            <button class=\"text-action\" type=\"button\" data-back=\"config\">返回<\/button>\n            <button class=\"primary-action\" id=\"save-profile\" type=\"button\" disabled>继续 <span>→<\/span><\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"onboarding-step\" data-step=\"basics\" hidden>\n          <header class=\"basics-heading\">\n            <span class=\"step-label\">步骤 3 / 4<\/span>\n            <h2>基础概念<\/h2>\n          <\/header>\n\n          <div class=\"concept-explorer\" id=\"concept-basics\" data-active-concept=\"qubit\" data-qubit-state=\"zero\">\n            <aside class=\"concept-sidebar\" aria-label=\"基础概念目录\">\n              <span>概念目录<\/span>\n              <button type=\"button\" data-concept-target=\"qubit\" aria-current=\"step\"><b>01<\/b><strong>量子比特<\/strong><\/button>\n              <button type=\"button\" data-concept-target=\"gate\"><b>02<\/b><strong>量子门<\/strong><\/button>\n              <button type=\"button\" data-concept-target=\"circuit\"><b>03<\/b><strong>量子电路<\/strong><\/button>\n              <button type=\"button\" data-concept-target=\"measurement\"><b>04<\/b><strong>测量<\/strong><\/button>\n            <\/aside>\n\n            <section class=\"concept-focus-card\" aria-live=\"polite\">\n              <header><span id=\"concept-position\">概念 1 / 4<\/span><\/header>\n\n              <article class=\"concept-panel\" data-concept-panel=\"qubit\">\n                <h3>量子比特，是保存量子信息的基本单位<\/h3>\n                <div class=\"qubit-story-copy\">\n                  <section>\n                    <span>信息载体<\/span>\n                    <p>普通比特的格子保存 <code>0<\/code> 或 <code>1<\/code>；量子比特的格子保存量子状态。<\/p>\n                  <\/section>\n                  <section class=\"is-quantum\">\n                    <span>两个基础状态<\/span>\n                    <h4><code>|0⟩<\/code> 与 <code>|1⟩<\/code><\/h4>\n                    <p><code>| ⟩<\/code> 表示“这是一个状态”。<code>|0⟩<\/code> 读作“零态”，<code>|1⟩<\/code> 读作“一态”；中间的 <code>0<\/code>、<code>1<\/code> 是状态名称<\/p>\n                  <\/section>\n                  <section>\n                    <span>直观比喻<\/span>\n                    <h4>像一枚正在旋转的硬币<\/h4>\n                    <p>看清之前，先同时保留正面和反面两种可能；测量就像让硬币停下，一次只会看到一面。这个比喻帮助理解“可能性”，量子比特并不是真的硬币。<\/p>\n                  <\/section>\n                <\/div>\n              <\/article>\n\n              <article class=\"concept-panel\" data-concept-panel=\"gate\" hidden>\n                <h3>量子门，是改变量子比特状态的操作<\/h3>\n                <div class=\"gate-single-demo\" id=\"basic-gate-demo\" data-gate=\"empty\">\n                  <div class=\"gate-picker\" aria-label=\"选择一个量子门进行演示\">\n                    <span>选择一个门<\/span>\n                    <button type=\"button\" data-basic-gate-action=\"h\"><b>H<\/b><small>制造两种可能<\/small><\/button>\n                    <button type=\"button\" data-basic-gate-action=\"cx\"><b>CX<\/b><small>关联两个量子比特<\/small><\/button>\n                    <button class=\"gate-clear\" type=\"button\" id=\"reset-basic-gates\">清空<\/button>\n                  <\/div>\n\n                  <div class=\"single-gate-stage\" aria-live=\"polite\">\n                    <div class=\"gate-view gate-view-empty\" data-gate-view=\"empty\">\n                      <span>线路还是空的<\/span><strong>请从上方选择一个门<\/strong>\n                    <\/div>\n                    <div class=\"gate-view gate-view-h\" data-gate-view=\"h\" hidden aria-label=\"H 门演示：零态经过 H 门变成加态\">\n                      <span class=\"single-state\"><b>量子比特 q0<\/b><small>输入状态 |0⟩<\/small><\/span><i><\/i>\n                      <button class=\"single-gate-symbol\" type=\"button\" data-basic-gate-run=\"h\" aria-label=\"点击 H 门，运行并测量一次\"><b>H<\/b><small>点击运行<\/small><\/button>\n                      <i><\/i><em class=\"single-measure\">⌁ 测量<\/em><span class=\"single-output\" id=\"basic-h-output\">等待<\/span>\n                    <\/div>\n                    <div class=\"gate-view gate-view-cx\" data-gate-view=\"cx\" hidden aria-label=\"CX 门演示：控制量子比特决定目标量子比特是否翻转\">\n                      <span class=\"single-state state-zero\"><b>量子比特 q0<\/b><small>输入 |1⟩ · 控制<\/small><\/span><i class=\"cx-wire wire-top\"><\/i>\n                      <button class=\"single-cx\" type=\"button\" data-basic-gate-run=\"cx\" aria-label=\"点击 CX 门，运行并测量一次\"><b>●<\/b><i><\/i><strong>⊕<\/strong><small id=\"basic-cx-action\">点击运行<\/small><\/button>\n                      <i class=\"cx-wire wire-top-after\"><\/i><span class=\"single-output output-top\" id=\"basic-cx-output-zero\">等待<\/span>\n                      <span class=\"single-state state-one\"><b>量子比特 q1<\/b><small>输入 |0⟩ · 目标<\/small><\/span><i class=\"cx-wire wire-bottom\"><\/i><i class=\"cx-wire wire-bottom-after\"><\/i><span class=\"single-output output-bottom\" id=\"basic-cx-output-one\">等待<\/span>\n                    <\/div>\n                  <\/div>\n                  <p id=\"basic-gate-narration\"><b>还没有加载门。<\/b>先选择 H 或 CX；演示区一次只显示一个门。<\/p>\n                <\/div>\n              <\/article>\n\n              <article class=\"concept-panel\" data-concept-panel=\"circuit\" hidden>\n                <h3>量子电路，把操作排成一次实验<\/h3>\n                <div class=\"circuit-focus-flow\" aria-label=\"量子电路从左到右的三个阶段\">\n                  <span><b>① 起点<\/b><strong>准备状态<\/strong><small>例如 |0⟩<\/small><\/span><i>→<\/i>\n                  <span><b>② 操作<\/b><strong>经过量子门<\/strong><small>例如 H、X<\/small><\/span><i>→<\/i>\n                  <span><b>③ 读出<\/b><strong>进行测量<\/strong><small>得到 0 或 1<\/small><\/span>\n                <\/div>\n              <\/article>\n\n              <article class=\"concept-panel\" data-concept-panel=\"measurement\" hidden>\n                <h3>测量，把量子状态读成 0 或 1<\/h3>\n                <p>下面测量的是同一条 H 门电路。每次运行都会重新准备 <code>|0⟩<\/code>，经过 H 门，再读出一个 0 或 1。<\/p>\n                <div class=\"measurement-circuit\" aria-label=\"零态经过 H 门后进行测量的单量子比特电路\">\n                  <span><b>q0<\/b><small>|0⟩<\/small><\/span><i><\/i><strong>H<\/strong><i><\/i><em>⌁ 测量<\/em><output>0 或 1<\/output>\n                <\/div>\n                <div class=\"measurement-focus-demo\">\n                  <button type=\"button\" id=\"basic-measure-button\" data-basic-action=\"measure\">先测量一次 <span>⌁<\/span><\/button>\n                  <div>\n                    <strong id=\"basic-measure-result\">还没有测量<\/strong>\n                    <p id=\"basic-measure-counts\">先运行一次，看看单次测量会发生什么。<\/p>\n                  <\/div>\n                <\/div>\n                <div class=\"measurement-live-results\" id=\"basic-measure-results\" aria-label=\"实时测量结果\">\n                  <div><span><b>0<\/b><small id=\"basic-zero-count\">0 次<\/small><\/span><i><em id=\"basic-zero-bar\"><\/em><\/i><strong id=\"basic-zero-percent\">0%<\/strong><\/div>\n                  <div><span><b>1<\/b><small id=\"basic-one-count\">0 次<\/small><\/span><i><em id=\"basic-one-bar\"><\/em><\/i><strong id=\"basic-one-percent\">0%<\/strong><\/div>\n                <\/div>\n                <div class=\"concept-one-line\" id=\"basic-measure-explanation\">一次测量只会得到一个答案；完成后，再用 100 次观察整体比例。<\/div>\n              <\/article>\n\n              <footer>\n                <button type=\"button\" id=\"next-concept\">下一个：量子门 →<\/button>\n              <\/footer>\n            <\/section>\n          <\/div>\n          <div class=\"dialog-actions align-right\">\n            <button class=\"text-action\" type=\"button\" data-back=\"profile\">返回<\/button>\n            <button class=\"primary-action\" id=\"continue-basics\" type=\"button\">我理解了，进入电路 <span>→<\/span><\/button>\n          <\/div>\n        <\/div>\n\n        <div class=\"onboarding-step\" data-step=\"ready\" hidden>\n          <span class=\"step-label\">步骤 4 / 4 · 互动电路<\/span>\n          <div id=\"concept-primer\" class=\"quantum-lab\">\n            <div class=\"lab-heading\">\n              <div>\n                <h2>亲手运行第一个量子电路<\/h2>\n\n              <\/div>\n              <button class=\"lab-reset\" id=\"lab-reset\" type=\"button\">重新开始 ↻<\/button>\n            <\/div>\n\n            <div class=\"use-case\">\n              <span class=\"use-case-icon\" aria-hidden=\"true\">⚖<\/span>\n              <p><b>平等获得援助<\/b><strong>专业人员完成紧急程度评估后，两份匿名申请同等优先，但当天只剩一个加急法律咨询名额。中心按公开规则公平抽签；申请人看到的公示结果，必须与监督员保存的审计记录完全一致。<\/strong><small>这是用于解释电路的教学类比，并不表示法律援助抽签需要量子计算机。抽签只适用于需求与优先级确实相同的情况。<\/small><\/p>\n            <\/div>\n\n            <div class=\"circuit-lab\" id=\"circuit-lab\" data-stage=\"0\">\n              <div class=\"circuit-canvas\" aria-label=\"两量子比特 Bell 电路互动图\">\n                <div class=\"qubit-label\"><b>q0<small>公示结果<\/small><\/b><span class=\"bit-state\" data-bit=\"0\">0<\/span><\/div>\n                <div class=\"wire wire-zero\"><i><\/i><\/div>\n                <button class=\"gate gate-h\" type=\"button\" data-lab-action=\"h\" aria-describedby=\"lab-narration\"><b>H<\/b><span>公平随机<\/span><\/button>\n                <div class=\"wire wire-zero-after\"><i><\/i><\/div>\n                <button class=\"cx-gate\" type=\"button\" data-lab-action=\"cx\" aria-label=\"应用 CX 门，关联公示结果与审计记录\" aria-describedby=\"lab-narration\" disabled>\n                  <b class=\"cx-control\">●<\/b><i aria-hidden=\"true\"><\/i><strong class=\"cx-target\">⊕<\/strong>\n                  <span>CX 门<\/span><small>点击关联<\/small>\n                <\/button>\n                <div class=\"wire wire-zero-end\"><i><\/i><\/div>\n                <button class=\"measure-button measure-zero\" type=\"button\" data-lab-action=\"measure\" disabled><span>⌁<\/span><b>测量<\/b><\/button>\n\n                <div class=\"qubit-label label-one\"><b>q1<small>审计记录<\/small><\/b><span class=\"bit-state\" data-bit=\"1\">0<\/span><\/div>\n                <div class=\"wire wire-one\"><i><\/i><\/div>\n                <div class=\"wire wire-one-through\"><i><\/i><\/div>\n                <div class=\"wire wire-one-after\"><i><\/i><\/div>\n                <div class=\"wire wire-one-end\"><i><\/i><\/div>\n                <button class=\"measure-button measure-one\" type=\"button\" data-lab-action=\"measure\" aria-label=\"测量两个量子比特\" disabled><span>⌁<\/span><b>测量<\/b><\/button>\n              <\/div>\n\n              <div class=\"lab-explanation\">\n                <span class=\"lab-progress\"><i><\/i><i><\/i><i><\/i><\/span>\n                <div class=\"lab-next-action\"><b>下一步<\/b><span id=\"lab-action-text\">① 点击左侧高亮的 H 门<\/span><\/div>\n                <span class=\"explanation-kicker\" id=\"lab-kicker\">先点击 H 门<\/span>\n                <h3 id=\"lab-title\">先让两份同等优先的申请机会相等<\/h3>\n                <p id=\"lab-narration\" aria-live=\"polite\">q0 代表面向申请人的公示结果。H 门让“匿名申请 A 获得名额”和“匿名申请 B 获得名额”成为概率相同的两种可能。<\/p>\n                <div class=\"analogy\"><b>平权类比<\/b><span id=\"lab-analogy\">在需求确实相同、资源又有限时，公开且不偏向身份的规则，比由某个人凭印象决定更公平。<\/span><\/div>\n              <\/div>\n            <\/div>\n\n            <div class=\"measurement-results\" id=\"measurement-results\" hidden>\n              <div class=\"result-copy\"><span>运行 100 次后的结果<\/span><strong id=\"result-summary\">每次公示结果都与审计记录一致<\/strong><p>只出现 <code>00<\/code> 和 <code>11<\/code>；谁获得名额是随机的，但公开结果始终留下相同、可核验的记录。<\/p><\/div>\n              <div class=\"mini-histogram\" aria-label=\"测量结果柱状图\">\n                <div><span><b>00<\/b><small>匿名申请 A<\/small><\/span><i><em id=\"bar-00\"><\/em><\/i><strong id=\"value-00\">50%<\/strong><\/div>\n                <div><span><b>11<\/b><small>匿名申请 B<\/small><\/span><i><em id=\"bar-11\"><\/em><\/i><strong id=\"value-11\">50%<\/strong><\/div>\n                <div class=\"impossible\"><span><b>01 / 10<\/b><small>公示与审计冲突<\/small><\/span><i><em><\/em><\/i><strong>0%<\/strong><\/div>\n              <\/div>\n            <\/div>\n\n          <\/div>\n          <div class=\"ready-footer\">\n            <span id=\"ready-hint\">完成三步互动后，就可以进入 LoomQ 工作台<\/span>\n            <button class=\"primary-action ready-action\" id=\"finish-onboarding\" type=\"button\" disabled>进入工作台 <span>↗<\/span><\/button>\n          <\/div>\n        <\/div>\n      <\/section>\n    <\/div>\n  <\/dialog>\n\n  <script>\n\nconst demoConfiguration = {\n  ready: true,\n  file_error: null,\n  fields: [\n    {name:'LOOMQ_LLM_BASE_URL',label:'API 根地址',description:'独立 Demo 使用内置模拟响应',default:'demo://local',secret:false,configured:true,value:'demo://local'},\n    {name:'LOOMQ_LLM_API_KEY',label:'API Key',description:'独立 Demo 不需要真实凭证',default:'',secret:true,configured:true,value:''},\n    {name:'LOOMQ_LLM_MODEL',label:'模型',description:'浏览器内 Demo 模型',default:'loomq-demo',secret:false,configured:true,value:'loomq-demo'},\n    {name:'LOOMQ_LLM_TIMEOUT_SECONDS',label:'请求超时',description:'演示值',default:'120',secret:false,configured:true,value:'120'},\n  ],\n};\nconst demoState = { conversationId: 'demo_conversation', artifact: null, version: 0 };\nfunction demoCircuit(prompt) {\n  const bell = /bell|贝尔/i.test(prompt);\n  const requested = prompt.match(/(\\d+)\\s*(?:比特|qubit)/i);\n  const qubits = bell ? 2 : Math.max(2, Math.min(8, requested ? Number(requested[1]) : 3));\n  const name = bell ? 'Bell 纠缠电路' : `${qubits} 比特 GHZ 电路`;\n  const lines = ['OPENQASM 2.0;', 'include \"qelib1.inc\";', `qreg q[${qubits}];`, `creg c[${qubits}];`, 'h q[0];'];\n  for (let index = 1; index < qubits; index += 1) lines.push(`cx q[${index - 1}],q[${index}];`);\n  lines.push('measure q -> c;');\n  return {name, qubits, qasm: lines.join('\\n')};\n}\nconst api = {\n  async getConfiguration() { return structuredClone(demoConfiguration); },\n  async saveConfiguration() { return structuredClone(demoConfiguration); },\n  async sendChat(payload) {\n    await new Promise(resolve => setTimeout(resolve, 360));\n    const circuit = demoCircuit(payload.prompt || '');\n    demoState.version += 1;\n    demoState.artifact = {id:'demo_circuit',version:demoState.version,goal:circuit.name,qubits:circuit.qubits};\n    return {\n      ok:true, task_type:'generate_qasm', response_language:'zh', qasm:circuit.qasm,\n      display_text:`已生成 ${circuit.name}。`, explanation:`已生成 ${circuit.name}。`, validation:{},\n      conversation_id:demoState.conversationId, active_artifact:{id:'demo_circuit',version:demoState.version,goal:circuit.name},\n      suggestions:['解释每个门的作用','改进当前电路','再运行一次'],\n    };\n  },\n  async runCurrentCircuit(payload) {\n    if (!demoState.artifact) throw new Error('请先生成一个电路');\n    await new Promise(resolve => setTimeout(resolve, 420));\n    const shots = Number(payload.shots || 1024);\n    const jitter = Math.round((Math.random() - .5) * Math.sqrt(shots));\n    const zero = Math.max(0, Math.min(shots, Math.floor(shots / 2) + jitter));\n    const width = demoState.artifact.qubits;\n    return {ok:true,backend:'spinq-demo',job_id:'local-demo',shots,counts:{['0'.repeat(width)]:zero,['1'.repeat(width)]:shots-zero}};\n  },\n  async resetConversation() { demoState.artifact=null; demoState.version=0; return {ok:true,deleted:true}; },\n};\n\n\n// Source: starter_kit/web/js/concept-basics.js\n// Focused concept explorer: sidebar navigation and one explanation at a time.\n\nconst CONCEPTS = [\n  { id: 'qubit', next: '量子门' },\n  { id: 'gate', next: '量子电路' },\n  { id: 'circuit', next: '测量' },\n  { id: 'measurement', next: null },\n];\n\nclass ConceptBasics {\n  constructor(root) {\n    this.root = root;\n    this.activeIndex = 0;\n    this.selectedGate = null;\n    this.gateRunResult = null;\n    this.cxHasRun = false;\n    this.measurementMode = 'single';\n    this.measurements = { zero: 0, one: 0 };\n  }\n\n  init() {\n    this.root.querySelectorAll('[data-concept-target]').forEach((button) => {\n      button.addEventListener('click', () => this.selectConcept(button.dataset.conceptTarget));\n    });\n    this.root.querySelector('[data-basic-action=\"measure\"]').addEventListener('click', () => {\n      this.runMeasurements();\n    });\n    this.root.querySelectorAll('[data-basic-gate-action]').forEach((button) => {\n      button.addEventListener('click', () => this.loadGate(button.dataset.basicGateAction));\n    });\n    this.root.querySelector('[data-basic-gate-run=\"h\"]').addEventListener('click', () => this.runHGate());\n    this.root.querySelector('[data-basic-gate-run=\"cx\"]').addEventListener('click', () => this.runCxGate());\n    this.root.querySelector('#reset-basic-gates').addEventListener('click', () => this.resetGateLesson());\n    this.root.querySelector('#next-concept').addEventListener('click', () => {\n      if (this.activeIndex < CONCEPTS.length - 1) {\n        this.selectConcept(CONCEPTS[this.activeIndex + 1].id);\n      }\n    });\n    this.reset();\n  }\n\n  reset() {\n    this.selectedGate = null;\n    this.gateRunResult = null;\n    this.cxHasRun = false;\n    this.measurementMode = 'single';\n    this.measurements = { zero: 0, one: 0 };\n    this.renderGateLesson();\n    this.renderMeasurements(null);\n    this.selectConcept('qubit');\n  }\n\n  selectConcept(conceptId) {\n    const nextIndex = CONCEPTS.findIndex((concept) => concept.id === conceptId);\n    if (nextIndex < 0) return;\n    this.activeIndex = nextIndex;\n    this.root.dataset.activeConcept = conceptId;\n\n    this.root.querySelectorAll('[data-concept-target]').forEach((button) => {\n      if (button.dataset.conceptTarget === conceptId) button.setAttribute('aria-current', 'step');\n      else button.removeAttribute('aria-current');\n    });\n    this.root.querySelectorAll('[data-concept-panel]').forEach((panel) => {\n      const active = panel.dataset.conceptPanel === conceptId;\n      panel.hidden = !active;\n      panel.classList.toggle('is-active', active);\n    });\n\n    const concept = CONCEPTS[nextIndex];\n    this.root.querySelector('#concept-position').textContent = `概念 ${nextIndex + 1} / ${CONCEPTS.length}`;\n    const nextButton = this.root.querySelector('#next-concept');\n    nextButton.hidden = !concept.next;\n    nextButton.textContent = concept.next ? `下一个：${concept.next} →` : '';\n  }\n\n  loadGate(action) {\n    if (!['h', 'cx'].includes(action)) return;\n    this.selectedGate = action;\n    this.gateRunResult = null;\n    this.cxHasRun = false;\n    this.renderGateLesson();\n  }\n\n  resetGateLesson() {\n    this.selectedGate = null;\n    this.gateRunResult = null;\n    this.cxHasRun = false;\n    this.renderGateLesson();\n  }\n\n  runHGate() {\n    if (this.selectedGate !== 'h') return;\n    this.gateRunResult = Math.random() < 0.5 ? '0' : '1';\n    const output = this.root.querySelector('#basic-h-output');\n    output.textContent = this.gateRunResult;\n    output.dataset.result = this.gateRunResult;\n    this.root.querySelector('#basic-gate-narration').innerHTML =\n      `<b>运行完成：测得 ${this.gateRunResult}。<\/b>每次点击都会重新准备 <code>|0⟩<\/code>、经过 H 门并测量，所以再次运行可能得到另一个结果。`;\n  }\n\n  runCxGate() {\n    if (this.selectedGate !== 'cx' || this.cxHasRun) return;\n    this.cxHasRun = true;\n    const outputs = [\n      this.root.querySelector('#basic-cx-output-zero'),\n      this.root.querySelector('#basic-cx-output-one'),\n    ];\n    outputs.forEach((output) => { output.dataset.result = '1'; });\n    outputs[0].textContent = '1';\n    outputs[1].textContent = '1';\n    const cxRunButton = this.root.querySelector('[data-basic-gate-run=\"cx\"]');\n    cxRunButton.disabled = true;\n    cxRunButton.setAttribute('aria-label', 'CX 门已运行');\n    this.root.querySelector('#basic-cx-action').textContent = '已运行';\n    this.root.querySelector('#basic-gate-narration').innerHTML =\n      '<b>运行完成：测得 11。<\/b>控制位 q0 是 1，所以 CX 保持 q0 为 1，并把目标位 q1 从 0 翻转为 1。';\n  }\n\n  renderGateLesson() {\n    const gate = this.selectedGate || 'empty';\n    const explanations = {\n      empty: '<b>还没有加载门。<\/b>先选择 H 或 CX；演示区一次只显示一个门。',\n      h: '<b>H 门：<\/b>把确定的 <code>|0⟩<\/code> 变成测得 0、1 机会各一半的状态。现在点击线路中的 H 门，运行并测量一次。',\n      cx: '<b>CX 门：<\/b>这里准备 q0 为 <code>|1⟩<\/code>、q1 为 <code>|0⟩<\/code>。点击线路中的 CX 门，观察目标位怎样翻转并测量。',\n    };\n\n    this.root.querySelector('#basic-gate-demo').dataset.gate = gate;\n    this.root.querySelectorAll('[data-gate-view]').forEach((view) => {\n      view.hidden = view.dataset.gateView !== gate;\n    });\n    this.root.querySelectorAll('[data-basic-gate-action]').forEach((button) => {\n      button.setAttribute('aria-pressed', button.dataset.basicGateAction === this.selectedGate ? 'true' : 'false');\n    });\n    const hOutput = this.root.querySelector('#basic-h-output');\n    hOutput.textContent = this.gateRunResult ?? '等待';\n    hOutput.dataset.result = this.gateRunResult ?? 'waiting';\n    const cxOutputs = [\n      this.root.querySelector('#basic-cx-output-zero'),\n      this.root.querySelector('#basic-cx-output-one'),\n    ];\n    cxOutputs.forEach((output) => {\n      output.textContent = this.cxHasRun ? '1' : '等待';\n      output.dataset.result = this.cxHasRun ? '1' : 'waiting';\n    });\n    const cxRunButton = this.root.querySelector('[data-basic-gate-run=\"cx\"]');\n    cxRunButton.disabled = this.cxHasRun;\n    cxRunButton.setAttribute('aria-label', this.cxHasRun ? 'CX 门已运行' : '点击 CX 门，运行并测量一次');\n    this.root.querySelector('#basic-cx-action').textContent = this.cxHasRun ? '已运行' : '点击运行';\n    this.root.querySelector('#basic-gate-narration').innerHTML = explanations[gate];\n  }\n\n  runMeasurements() {\n    const shots = this.measurementMode === 'single' ? 1 : 100;\n    this.measurements = { zero: 0, one: 0 };\n    let lastResult = null;\n    for (let shot = 0; shot < shots; shot += 1) {\n      lastResult = Math.random() < 0.5 ? 'zero' : 'one';\n      this.measurements[lastResult] += 1;\n    }\n    if (this.measurementMode === 'single') this.measurementMode = 'batch';\n    this.renderMeasurements(lastResult, shots);\n  }\n\n  renderMeasurements(result, shots = 0) {\n    const total = this.measurements.zero + this.measurements.one;\n    const resultLabel = this.root.querySelector('#basic-measure-result');\n    resultLabel.textContent = result === null\n      ? '还没有测量'\n      : shots === 1\n        ? `这一次得到 ${result === 'zero' ? '0' : '1'}`\n        : `100 次测量完成：0 和 1 都出现了`;\n    resultLabel.dataset.result = result || 'waiting';\n    this.root.querySelector('#basic-measure-counts').textContent = result === null\n      ? '先运行一次，看看单次测量会发生什么。'\n      : shots === 1\n        ? '一次只能看到一个答案。现在用 100 次测量观察比例。'\n        : `相同电路重复运行 ${total} 次，结果会接近各占一半。`;\n\n    const zeroPercent = total ? Math.round((this.measurements.zero / total) * 100) : 0;\n    const onePercent = total ? 100 - zeroPercent : 0;\n    this.root.querySelector('#basic-zero-count').textContent = `${this.measurements.zero} 次`;\n    this.root.querySelector('#basic-one-count').textContent = `${this.measurements.one} 次`;\n    this.root.querySelector('#basic-zero-percent').textContent = `${zeroPercent}%`;\n    this.root.querySelector('#basic-one-percent').textContent = `${onePercent}%`;\n    this.root.querySelector('#basic-zero-bar').style.width = `${zeroPercent}%`;\n    this.root.querySelector('#basic-one-bar').style.width = `${onePercent}%`;\n    this.root.querySelector('#basic-measure-button').innerHTML = this.measurementMode === 'single'\n      ? '先测量一次 <span>⌁<\/span>'\n      : '测量 100 次 <span>⌁<\/span>';\n    this.root.querySelector('#basic-measure-explanation').textContent = result === null\n      ? '一次测量只会得到一个答案；完成后，再用 100 次观察整体比例。'\n      : shots === 1\n        ? '刚才只出现一个结果，不代表另一个结果不可能。点击“测量 100 次”继续。'\n        : '柱状图不是固定答案；再次测量 100 次，具体次数会变化，但通常接近 50% / 50%。';\n  }\n}\n\n\n// Source: starter_kit/web/js/onboarding.js\n// First-run configuration, learning profile, and tutorial orchestration.\n\nclass OnboardingController {\n  constructor({ api, preferences, quantumLab, conceptBasics, onFinish = () => {} }) {\n    this.api = api;\n    this.preferences = preferences;\n    this.quantumLab = quantumLab;\n    this.conceptBasics = conceptBasics;\n    this.onFinish = onFinish;\n    this.configuration = null;\n    this.flow = 'guide';\n    this.selectedProfile = preferences.getLearningPreferences().profile;\n    this.elements = this.collectElements();\n  }\n\n  collectElements() {\n    return {\n      dialog: document.querySelector('#onboarding'),\n      configForm: document.querySelector('#config-form'),\n      configFields: document.querySelector('#config-fields'),\n      configError: document.querySelector('#config-error'),\n      runtimeLabel: document.querySelector('#runtime-label'),\n      statusDot: document.querySelector('#status-dot'),\n      finish: document.querySelector('#finish-onboarding'),\n      saveProfile: document.querySelector('#save-profile'),\n      continueBasics: document.querySelector('#continue-basics'),\n      primer: document.querySelector('#concept-primer'),\n      hint: document.querySelector('#ready-hint'),\n    };\n  }\n\n  async init() {\n    this.bindEvents();\n    try {\n      this.configuration = await this.api.getConfiguration();\n      this.renderConfigFields(this.configuration.fields);\n      this.updateRuntimeStatus(this.configuration.ready);\n      const requestedStep = new URLSearchParams(window.location.search).get('open');\n      if (!this.configuration.ready) {\n        this.open('config', true, requestedStep === 'config' ? 'config' : 'guide');\n      } else if (requestedStep === 'config') this.open('config', false, 'config');\n      else if (requestedStep === 'guide') this.open('profile', false, 'guide');\n      else if (!this.preferences.isOnboardingComplete()) this.open('profile', true, 'guide');\n    } catch (error) {\n      this.updateRuntimeStatus(false, error.message || '配置检查失败');\n    }\n  }\n\n  isReady() {\n    return Boolean(this.configuration?.ready);\n  }\n\n  open(step = 'config', required = false, flow = 'guide') {\n    this.flow = flow;\n    this.elements.dialog.dataset.required = required ? 'true' : 'false';\n    this.showStep(step);\n    if (!this.elements.dialog.open) this.elements.dialog.showModal();\n  }\n\n  showStep(step) {\n    this.elements.dialog.dataset.activeStep = step;\n    document.querySelectorAll('.onboarding-step').forEach((panel) => {\n      panel.hidden = panel.dataset.step !== step;\n    });\n    if (step === 'profile') this.restoreProfileSelection();\n  }\n\n  bindEvents() {\n    this.elements.configForm.addEventListener('submit', (event) => this.saveConfiguration(event));\n    document.querySelectorAll('[data-profile]').forEach((button) => {\n      button.addEventListener('click', () => this.selectProfile(button));\n    });\n    this.elements.saveProfile.addEventListener('click', () => this.saveProfile());\n    this.elements.continueBasics.addEventListener('click', () => this.continueFromBasics());\n    this.elements.finish.addEventListener('click', () => this.finish());\n    document.querySelectorAll('#open-settings, #open-config').forEach((button) => {\n      button.addEventListener('click', () => this.open('config', false, 'config'));\n    });\n    document.querySelector('#open-guide').addEventListener('click', () => {\n      this.open(this.isReady() ? 'profile' : 'config', false, 'guide');\n    });\n    document.querySelector('#close-onboarding').addEventListener('click', () => {\n      if (this.elements.dialog.dataset.required !== 'true') this.elements.dialog.close();\n    });\n    document.querySelectorAll('[data-back]').forEach((button) => {\n      button.addEventListener('click', () => this.showStep(button.dataset.back));\n    });\n    this.elements.dialog.addEventListener('cancel', (event) => {\n      if (this.elements.dialog.dataset.required === 'true') event.preventDefault();\n    });\n  }\n\n  async saveConfiguration(event) {\n    event.preventDefault();\n    const submit = this.elements.configForm.querySelector('[type=\"submit\"]');\n    this.elements.configError.textContent = '';\n    submit.disabled = true;\n    submit.firstChild.textContent = '正在保存… ';\n    try {\n      const payload = Object.fromEntries(new FormData(this.elements.configForm).entries());\n      this.configuration = await this.api.saveConfiguration(payload);\n      this.renderConfigFields(this.configuration.fields);\n      this.updateRuntimeStatus(this.configuration.ready);\n      if (this.flow === 'config') {\n        this.elements.dialog.dataset.required = 'false';\n        this.elements.dialog.close();\n      } else {\n        this.showStep('profile');\n      }\n    } catch (error) {\n      this.elements.configError.textContent = error.message || '配置保存失败，请检查后重试。';\n    } finally {\n      submit.disabled = false;\n      submit.firstChild.textContent = '保存并继续 ';\n    }\n  }\n\n  selectProfile(button) {\n    this.selectedProfile = button.dataset.profile;\n    document.querySelectorAll('[data-profile]').forEach((option) => {\n      option.classList.toggle('is-selected', option === button);\n    });\n    this.elements.saveProfile.disabled = false;\n  }\n\n  restoreProfileSelection() {\n    const { profile } = this.preferences.getLearningPreferences();\n    if (profile) this.selectedProfile = profile;\n    if (!this.selectedProfile) return;\n    document.querySelectorAll('[data-profile]').forEach((option) => {\n      option.classList.toggle('is-selected', option.dataset.profile === this.selectedProfile);\n    });\n    this.elements.saveProfile.disabled = false;\n  }\n\n  saveProfile() {\n    if (!this.selectedProfile) return;\n    const modules = this.preferences.saveLearningPreferences(this.selectedProfile);\n    this.pendingExampleCircuit = modules.exampleCircuit;\n    if (modules.conceptBasics) {\n      this.conceptBasics.reset();\n      this.showStep('basics');\n      return;\n    }\n    if (modules.exampleCircuit) this.prepareReadyStep(true);\n    else this.finish();\n  }\n\n  continueFromBasics() {\n    this.prepareReadyStep(this.pendingExampleCircuit);\n  }\n\n  prepareReadyStep(showPrimer) {\n    this.elements.primer.hidden = !showPrimer;\n    this.elements.finish.disabled = showPrimer;\n    this.elements.hint.textContent = showPrimer\n      ? '完成三步互动后，就可以进入 LoomQ 工作台'\n      : '示例电路互动已跳过，你可以直接进入工作台';\n    if (showPrimer) this.quantumLab.reset();\n    this.showStep('ready');\n  }\n\n  finish() {\n    this.preferences.markOnboardingComplete();\n    this.elements.dialog.dataset.required = 'false';\n    this.elements.dialog.close();\n    this.onFinish();\n  }\n\n  renderConfigFields(fields) {\n    this.elements.configFields.replaceChildren();\n    fields.forEach((field) => this.elements.configFields.append(this.createConfigField(field)));\n  }\n\n  createConfigField(field) {\n    const wrapper = document.createElement('label');\n    wrapper.className = `config-field${field.configured ? ' is-valid' : ''}`;\n    const head = document.createElement('span');\n    head.className = 'field-head';\n    const label = document.createElement('strong');\n    label.textContent = field.label;\n    const state = document.createElement('small');\n    state.textContent = field.configured ? '已配置 ✓' : '需要配置';\n    head.append(label, state);\n    const input = document.createElement('input');\n    input.name = field.name;\n    input.type = field.secret ? 'password' : (field.name.endsWith('TIMEOUT_SECONDS') ? 'number' : 'text');\n    input.autocomplete = field.secret ? 'new-password' : 'off';\n    input.placeholder = field.secret && field.configured ? '已保存；留空则保持不变' : field.description;\n    input.value = field.secret ? '' : (field.value || field.default || '');\n    if (field.name.endsWith('TIMEOUT_SECONDS')) {\n      input.min = '1';\n      input.max = '3600';\n    }\n    const help = document.createElement('span');\n    help.className = 'field-help';\n    help.textContent = field.description;\n    wrapper.append(head, input, help);\n    return wrapper;\n  }\n\n  updateRuntimeStatus(ready, label) {\n    this.elements.statusDot.classList.toggle('is-offline', !ready);\n    this.elements.runtimeLabel.textContent = label || (ready ? '模型已连接 · 本地模拟器就绪' : '需要完成运行配置');\n  }\n}\n\n\n// Source: starter_kit/web/js/preferences.js\n// Device-local onboarding and explanation preferences.\n\nconst KEYS = Object.freeze({\n  profile: 'loomq.quantumProfile',\n  explainConcepts: 'loomq.explainConcepts',\n  onboardingComplete: 'loomq.onboardingComplete',\n});\n\nconst PROFILE_MODULES = Object.freeze({\n  new: Object.freeze({ conceptBasics: true, exampleCircuit: true }),\n  some: Object.freeze({ conceptBasics: false, exampleCircuit: true }),\n  expert: Object.freeze({ conceptBasics: false, exampleCircuit: false }),\n});\n\nclass PreferenceStore {\n  constructor(storage = window.localStorage) {\n    this.storage = storage;\n  }\n\n  getLearningPreferences() {\n    const profile = this.get(KEYS.profile) || '';\n    const modules = this.modulesForProfile(profile);\n    return {\n      profile,\n      explainConcepts: modules.conceptBasics,\n      ...modules,\n    };\n  }\n\n  modulesForProfile(profile) {\n    return PROFILE_MODULES[profile] || { conceptBasics: false, exampleCircuit: false };\n  }\n\n  saveLearningPreferences(profile) {\n    const modules = this.modulesForProfile(profile);\n    this.set(KEYS.profile, profile);\n    this.set(KEYS.explainConcepts, String(modules.conceptBasics));\n    return modules;\n  }\n\n  isOnboardingComplete() {\n    return this.get(KEYS.onboardingComplete) === 'true';\n  }\n\n  markOnboardingComplete() {\n    this.set(KEYS.onboardingComplete, 'true');\n  }\n\n  get(key) {\n    try {\n      return this.storage.getItem(key);\n    } catch (_error) {\n      return null;\n    }\n  }\n\n  set(key, value) {\n    try {\n      this.storage.setItem(key, value);\n    } catch (_error) {\n      // Preferences are optional; the app remains usable without browser storage.\n    }\n  }\n}\n\n\n// Source: starter_kit/web/js/quantum-lab.js\n// Interactive Bell-circuit tutorial state machine.\n\nconst COPY = Object.freeze({\n  0: {\n    kicker: '先点击 H 门',\n    title: '先让两份同等优先的申请机会相等',\n    narration: 'q0 代表面向申请人的公示结果。H 门让“匿名申请 A 获得名额”和“匿名申请 B 获得名额”成为概率相同的两种可能。',\n    analogy: '在需求确实相同、资源又有限时，公开且不偏向身份的规则，比由某个人凭印象决定更公平。',\n    action: '① 点击左侧高亮的 H 门',\n  },\n  1: {\n    kicker: 'q0 已准备好 · 下一步点击 CX 门',\n    title: '让公示结果与审计记录保持一致',\n    narration: '现在点击电路中高亮的 CX 门，把 q0 的公示结果与 q1 的审计记录关联起来。',\n    analogy: '如果公示屏与审计记录各自独立抽签，就可能写下不同答案，审计也失去意义。一次公平抽签，必须对应一份相同记录。',\n    action: '② 点击两条线中间高亮的 CX 门',\n  },\n  2: {\n    kicker: '纠缠已建立 · 点击测量',\n    title: 'CX 把公示结果与审计记录关联起来',\n    narration: 'q0 是控制端，q1 是目标端：q0 为 0 时 q1 保持 0；q0 为 1 时 q1 翻转为 1。现在可以测量 100 次。',\n    analogy: 'H 负责“选择时不偏向任何一份匿名申请”，CX 负责“选择后留下相同记录”。',\n    action: '③ 点击右侧任意一个高亮的“测量”',\n  },\n});\n\nclass QuantumLab {\n  constructor({ root, results, finishButton, hint }) {\n    this.root = root;\n    this.results = results;\n    this.finishButton = finishButton;\n    this.hint = hint;\n    this.stage = 0;\n  }\n\n  init() {\n    this.root.addEventListener('click', (event) => this.handleAction(event));\n    document.querySelector('#lab-reset').addEventListener('click', () => this.reset());\n  }\n\n  handleAction(event) {\n    const action = event.target.closest('[data-lab-action]')?.dataset.labAction;\n    if (action === 'h' && this.stage === 0) this.setStage(1);\n    if (action === 'cx' && this.stage === 1) this.setStage(2);\n    if (action === 'measure' && this.stage === 2) this.measure();\n  }\n\n  reset() {\n    this.stage = 0;\n    this.root.dataset.stage = '0';\n    this.setGateAvailability(0);\n    this.updateCopy(COPY[0]);\n    this.root.querySelectorAll('.bit-state').forEach((bit) => { bit.textContent = '0'; });\n    this.results.hidden = true;\n    this.finishButton.disabled = true;\n    this.hint.textContent = '完成三步互动后，就可以进入 LoomQ 工作台';\n  }\n\n  setStage(stage) {\n    this.stage = stage;\n    this.root.dataset.stage = String(stage);\n    this.setGateAvailability(stage);\n    this.updateCopy(COPY[stage]);\n  }\n\n  measure() {\n    this.stage = 3;\n    this.root.dataset.stage = '3';\n    this.setGateAvailability(3);\n    const zeroCount = this.sample(100);\n    const oneCount = 100 - zeroCount;\n    const finalBit = Math.random() < 0.5 ? '0' : '1';\n    this.root.querySelectorAll('.bit-state').forEach((bit) => { bit.textContent = finalBit; });\n    this.updateCopy({\n      kicker: '测量完成 · 规律出现了',\n      title: '选择公平，而且全过程可以核验',\n      narration: `这次 100 次实验中，00 出现 ${zeroCount} 次，11 出现 ${oneCount} 次。谁获得名额不可预知，但公示结果与审计记录从未冲突。`,\n      analogy: '这个电路只演示同等优先情况下的程序公平。真正的平等权益还需要按需求分配、充足资源、申诉机制与公共监督。',\n      action: '完成 · 现在可以进入 LoomQ 工作台',\n    });\n    this.results.querySelector('#value-00').textContent = `${zeroCount}%`;\n    this.results.querySelector('#value-11').textContent = `${oneCount}%`;\n    this.results.hidden = false;\n    window.requestAnimationFrame(() => {\n      this.results.querySelector('#bar-00').style.width = `${zeroCount}%`;\n      this.results.querySelector('#bar-11').style.width = `${oneCount}%`;\n    });\n    this.finishButton.disabled = false;\n    this.hint.textContent = '完成！你已经运行并读懂了一个 Bell 纠缠电路';\n  }\n\n  sample(shots) {\n    let zeroCount = 0;\n    for (let shot = 0; shot < shots; shot += 1) {\n      if (Math.random() < 0.5) zeroCount += 1;\n    }\n    return zeroCount;\n  }\n\n  setGateAvailability(stage) {\n    this.root.querySelector('[data-lab-action=\"h\"]').disabled = stage >= 1;\n    this.root.querySelector('[data-lab-action=\"cx\"]').disabled = stage !== 1;\n rement-results { grid-template-columns: 1fr; }\n  .ready-footer { align-items: flex-end; justify-content: space-between; }\n  .ready-footer > span { max-width: 160px; }\n}\n\n@media (min-width: 761px) and (max-width: 1040px) {\n  .workspace-split { grid-template-columns: 1fr; }\n  .chat-workspace, .circuit-panel { height: calc(100dvh - 28px); min-height: 680px; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }\n}\n\n<\/style>\n<\/head>\n<body class=\"workspace-page\">\n  <div class=\"ambient ambient-one\" aria-hidden=\"true\"><\/div>\n  <div class=\"ambient ambient-two\" aria-hidden=\"true\"><\/div>\n\n  <header class=\"topbar\">\n    <a class=\"brand\" href=\"#home\" data-demo-home aria-label=\"返回 LoomQ 主界面\">\n      <span class=\"brand-mark\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/span>\n      <span>LoomQ <b>Workspace<\/b><\/span>\n    <\/a>\n    <nav class=\"workspace-nav\" aria-label=\"工作台导航\">\n      <a href=\"#home\" data-demo-home>运行配置<\/a>\n      <a class=\"back-home\" href=\"#home\" data-demo-home>← 返回主界面<\/a>\n    <\/nav>\n  <\/header>\n\n  <main class=\"workspace-main\">\n    <section class=\"workspace-heading\">\n      <div>\n        <span class=\"workspace-kicker\">QUANTUM AGENT WORKSPACE<\/span>\n        <h1>从一个问题，<br><em>继续到可运行的电路。<\/em><\/h1>\n      <\/div>\n      <p>这里专注于实验本身。你可以连续追问、修改当前电路，或者开始一项新的设计。<\/p>\n    <\/section>\n\n    <div class=\"journey\" aria-label=\"一次量子实验的四个步骤\">\n      <div class=\"journey-line\" aria-hidden=\"true\"><span><\/span><\/div>\n      <div class=\"journey-step is-active\" data-journey-step=\"0\"><b>01<\/b><strong>说出想法<\/strong><small>自然语言即可<\/small><\/div>\n      <div class=\"journey-step\" data-journey-step=\"1\"><b>02<\/b><strong>编织电路<\/strong><small>自动生成 QASM<\/small><\/div>\n      <div class=\"journey-step\" data-journey-step=\"2\"><b>03<\/b><strong>真实运行<\/strong><small>本地模拟验证<\/small><\/div>\n      <div class=\"journey-step\" data-journey-step=\"3\"><b>04<\/b><strong>继续改进<\/strong><small>上下文不会丢失<\/small><\/div>\n    <\/div>\n\n    <div class=\"workspace-split\">\n      <section class=\"workspace chat-workspace\" aria-label=\"Agent 对话区\">\n        <div class=\"conversation\" id=\"conversation\" aria-live=\"polite\">\n          <article class=\"message agent-message intro-message\">\n            <div class=\"avatar\" aria-hidden=\"true\">LQ<\/div>\n            <div class=\"message-body\">\n              <div class=\"message-meta\">LoomQ Agent<\/div>\n              <p>描述一个实验、粘贴一段错误代码，或者继续修改当前电路。我会记住这次讨论中的电路和最近上下文。<\/p>\n            <\/div>\n          <\/article>\n        <\/div>\n\n        <form class=\"composer\" id=\"composer\">\n          <div class=\"composer-prompts\" aria-label=\"聊天快捷提示\">\n            <button type=\"button\" data-prompt=\"生成一个 3 比特 GHZ 态并进行全测量\">\n              <span>01<\/span><strong>生成 GHZ 态<\/strong>\n            <\/button>\n            <button type=\"button\" data-prompt=\"我想制备贝尔态，请修复这段代码：H q[0]; CX q[0] q[1]\">\n              <span>02<\/span><strong>修复量子代码<\/strong>\n            <\/button>\n            <button type=\"button\" data-prompt=\"我要运行一个 26 比特电路，必须免费并且不能排队\">\n              <span>03<\/span><strong>筛选运行平台<\/strong>\n            <\/button>\n          <\/div>\n          <div class=\"conversation-context\" id=\"conversation-context\" hidden>\n            <span id=\"conversation-context-label\"><\/span>\n          <\/div>\n          <label class=\"sr-only\" for=\"prompt\">描述你的量子计算需求<\/label>\n          <textarea id=\"prompt\" rows=\"2\" maxlength=\"12000\" placeholder=\"例如：生成一个 3 比特 GHZ 态并测量全部量子比特…\" required><\/textarea>\n          <div class=\"composer-footer\">\n            <div class=\"composer-left-actions\">\n              <button class=\"clear-conversation-button\" id=\"clear-conversation\" type=\"button\">清空对话 · 重新开始<\/button>\n              <span><kbd>Enter<\/kbd> 发送 · <kbd>Shift<\/kbd> + <kbd>Enter<\/kbd> 换行<\/span>\n            <\/div>\n            <button class=\"send-button\" id=\"send\" type=\"submit\" aria-label=\"发送需求\"><span aria-hidden=\"true\">↗<\/span><\/button>\n          <\/div>\n        <\/form>\n        <p class=\"privacy-note\">对话与电路上下文仅保存在这台电脑上的 LoomQ 会话中。<\/p>\n      <\/section>\n\n      <aside class=\"circuit-panel\" id=\"circuit-panel\" aria-labelledby=\"circuit-title\">\n        <header class=\"circuit-panel-head\">\n          <div>\n            <span>CURRENT CIRCUIT<\/span>\n            <h2 id=\"circuit-title\">当前电路<\/h2>\n          <\/div>\n          <div class=\"circuit-summary\" id=\"circuit-summary\" hidden><\/div>\n        <\/header>\n        <div class=\"circuit-empty\" id=\"circuit-empty\">\n          <span aria-hidden=\"true\">|0⟩<\/span>\n          <strong>等待当前电路<\/strong>\n        <\/div>\n        <div class=\"circuit-view\" id=\"circuit-view\" hidden>\n          <div class=\"circuit-caption\">\n            <strong id=\"circuit-name\">量子电路<\/strong>\n            <span id=\"circuit-version\"><\/span>\n          <\/div>\n          <div class=\"circuit-scroll\" id=\"circuit-scroll\" tabindex=\"0\" aria-label=\"量子电路图\"><\/div>\n          <section class=\"circuit-runner\" id=\"circuit-runner\" aria-labelledby=\"circuit-runner-title\">\n            <div class=\"circuit-runner-controls\">\n              <div>\n                <span>LOCAL SIMULATOR<\/span>\n                <strong id=\"circuit-runner-title\">本地测量<\/strong>\n              <\/div>\n              <label>\n                <span>Shots<\/span>\n                <select id=\"circuit-shots\" aria-label=\"测量次数\">\n                  <option value=\"256\">256<\/option>\n                  <option value=\"1024\" selected>1024<\/option>\n                  <option value=\"4096\">4096<\/option>\n                <\/select>\n              <\/label>\n              <button id=\"run-current-circuit\" type=\"button\">运行测量 <span aria-hidden=\"true\">▶<\/span><\/button>\n            <\/div>\n            <p class=\"circuit-runner-status\" id=\"circuit-runner-status\" aria-live=\"polite\">使用 SpinQ 本地模拟器，不会提交到量子真机。<\/p>\n            <div class=\"circuit-runner-results\" id=\"circuit-runner-results\" hidden><\/div>\n          <\/section>\n        <\/div>\n      <\/aside>\n    <\/div>\n  <\/main>\n\n  <template id=\"loading-template\">\n    <article class=\"message agent-message loading-message\">\n      <div class=\"avatar\" aria-hidden=\"true\">LQ<\/div>\n      <div class=\"message-body\">\n        <div class=\"message-meta\">LoomQ Agent<\/div>\n        <div class=\"progress-line\"><span><\/span><span><\/span><span><\/span><\/div>\n        <p class=\"loading-label\">正在理解需求并准备量子实验…<\/p>\n      <\/div>\n    <\/article>\n  <\/template>\n\n  <script>\n\nconst demoConfiguration = {\n  ready: true,\n  file_error: null,\n  fields: [\n    {name:'LOOMQ_LLM_BASE_URL',label:'API 根地址',description:'独立 Demo 使用内置模拟响应',default:'demo://local',secret:false,configured:true,value:'demo://local'},\n    {name:'LOOMQ_LLM_API_KEY',label:'API Key',description:'独立 Demo 不需要真实凭证',default:'',secret:true,configured:true,value:''},\n    {name:'LOOMQ_LLM_MODEL',label:'模型',description:'浏览器内 Demo 模型',default:'loomq-demo',secret:false,configured:true,value:'loomq-demo'},\n    {name:'LOOMQ_LLM_TIMEOUT_SECONDS',label:'请求超时',description:'演示值',default:'120',secret:false,configured:true,value:'120'},\n  ],\n};\nconst demoState = { conversationId: 'demo_conversation', artifact: null, version: 0 };\nfunction demoCircuit(prompt) {\n  const bell = /bell|贝尔/i.test(prompt);\n  const requested = prompt.match(/(\\d+)\\s*(?:比特|qubit)/i);\n  const qubits = bell ? 2 : Math.max(2, Math.min(8, requested ? Number(requested[1]) : 3));\n  const name = bell ? 'Bell 纠缠电路' : `${qubits} 比特 GHZ 电路`;\n  const lines = ['OPENQASM 2.0;', 'include \"qelib1.inc\";', `qreg q[${qubits}];`, `creg c[${qubits}];`, 'h q[0];'];\n  for (let index = 1; index < qubits; index += 1) lines.push(`cx q[${index - 1}],q[${index}];`);\n  lines.push('measure q -> c;');\n  return {name, qubits, qasm: lines.join('\\n')};\n}\nconst api = {\n  async getConfiguration() { return structuredClone(demoConfiguration); },\n  async saveConfiguration() { return structuredClone(demoConfiguration); },\n  async sendChat(payload) {\n    await new Promise(resolve => setTimeout(resolve, 360));\n    const circuit = demoCircuit(payload.prompt || '');\n    demoState.version += 1;\n    demoState.artifact = {id:'demo_circuit',version:demoState.version,goal:circuit.name,qubits:circuit.qubits};\n    return {\n      ok:true, task_type:'generate_qasm', response_language:'zh', qasm:circuit.qasm,\n      display_text:`已生成 ${circuit.name}。`, explanation:`已生成 ${circuit.name}。`, validation:{},\n      conversation_id:demoState.conversationId, active_artifact:{id:'demo_circuit',version:demoState.version,goal:circuit.name},\n      suggestions:['解释每个门的作用','改进当前电路','再运行一次'],\n    };\n  },\n  async runCurrentCircuit(payload) {\n    if (!demoState.artifact) throw new Error('请先生成一个电路');\n    await new Promise(resolve => setTimeout(resolve, 420));\n    const shots = Number(payload.shots || 1024);\n    const jitter = Math.round((Math.random() - .5) * Math.sqrt(shots));\n    const zero = Math.max(0, Math.min(shots, Math.floor(shots / 2) + jitter));\n    const width = demoState.artifact.qubits;\n    return {ok:true,backend:'spinq-demo',job_id:'local-demo',shots,counts:{['0'.repeat(width)]:zero,['1'.repeat(width)]:shots-zero}};\n  },\n  async resetConversation() { demoState.artifact=null; demoState.version=0; return {ok:true,deleted:true}; },\n};\n\n\n// Source: starter_kit/web/js/markdown.js\n// Small, dependency-free Markdown renderer for model-authored chat text.\n// It creates DOM nodes and never treats model output as trusted HTML.\n\nfunction renderMarkdown(container, source) {\n  const lines = String(source || '').replace(/\\r\\n?/g, '\\n').split('\\n');\n  let paragraph = [];\n  let list = null;\n  let code = null;\n\n  const flushParagraph = () => {\n    if (!paragraph.length) return;\n    const node = document.createElement('p');\n    appendInline(node, paragraph.join(' '));\n    container.append(node);\n    paragraph = [];\n  };\n  const closeList = () => { list = null; };\n\n  lines.forEach((line) => {\n    if (code) {\n      if (/^\\s*```/.test(line)) {\n        container.append(code.pre);\n        code = null;\n      } else {\n        code.lines.push(line);\n        code.code.textContent = code.lines.join('\\n');\n      }\n      return;\n    }\n\n    const fence = line.match(/^\\s*```([\\w+-]*)\\s*$/);\n    if (fence) {\n      flushParagraph();\n      closeList();\n      const pre = document.createElement('pre');\n      const codeNode = document.createElement('code');\n      if (fence[1]) codeNode.dataset.language = fence[1];\n      pre.append(codeNode);\n      code = { pre, code: codeNode, lines: [] };\n      return;\n    }\n    if (!line.trim()) {\n      flushParagraph();\n      closeList();\n      return;\n    }\n\n    const heading = line.match(/^\\s*(#{1,4})\\s+(.+)$/);\n    if (heading) {\n      flushParagraph();\n      closeList();\n      const node = document.createElement(`h${Math.min(heading[1].length + 2, 6)}`);\n      appendInline(node, heading[2]);\n      container.append(node);\n      return;\n    }\n\n    const item = line.match(/^\\s*([-*+]\\s+|\\d+[.)]\\s+)(.+)$/);\n    if (item) {\n      flushParagraph();\n      const ordered = /^\\d/.test(item[1]);\n      if (!list || list.tagName !== (ordered ? 'OL' : 'UL')) {\n        list = document.createElement(ordered ? 'ol' : 'ul');\n        container.append(list);\n      }\n      const node = document.createElement('li');\n      appendInline(node, item[2]);\n      list.append(node);\n      return;\n    }\n\n    const quote = line.match(/^\\s*>\\s?(.*)$/);\n    if (quote) {\n      flushParagraph();\n      closeList();\n      const node = document.createElement('blockquote');\n      appendInline(node, quote[1]);\n      container. nversation.append(renderUserMessage(prompt));\n    this.starterPrompts.hidden = true;\n    this.journey.setActive(1);\n    this.promptInput.value = '';\n    this.setBusy(true);\n    const loading = this.loadingTemplate.content.firstElementChild.cloneNode(true);\n    this.conversation.append(loading);\n    this.scrollConversation();\n    const runStageTimer = window.setTimeout(() => this.journey.setActive(2), 500);\n\n    try {\n      const learning = this.preferences.getLearningPreferences();\n      const data = await this.api.sendChat({\n        prompt,\n        quantum_profile: learning.profile || undefined,\n        explain_concepts: learning.explainConcepts,\n        ...this.conversationSession.requestContext(),\n      });\n      loading.remove();\n      this.conversationSession.update(data);\n      if (data.qasm) {\n        this.circuitVisualizer?.render(data.qasm, data.active_artifact || {});\n      }\n      this.conversation.append(renderAgentResult(data, {\n        onSuggestion: (suggestion) => this.useStarterPrompt(suggestion),\n      }));\n      this.renderContext();\n      this.journey.setActive(3);\n    } catch (error) {\n      loading.remove();\n      const message = error.message || '暂时无法连接 LoomQ Agent，请稍后再试。';\n      this.conversation.append(renderAgentResult({\n        ok: false,\n        display_text: '连接或运行遇到问题。',\n        message,\n      }));\n      if (/鉴权失败|HTTP 401/.test(message)) {\n        this.onboarding.open('config', true);\n      }\n    } finally {\n      window.clearTimeout(runStageTimer);\n      this.setBusy(false);\n      this.focus();\n      this.scrollConversation();\n    }\n  }\n\n  setBusy(busy) {\n    this.sendButton.disabled = busy;\n    this.promptInput.disabled = busy;\n    this.sendButton.querySelector('span:first-child').textContent = busy ? '实验进行中…' : '开始实验';\n  }\n\n  scrollConversation() {\n    this.conversation.scrollTo({ top: this.conversation.scrollHeight, behavior: 'smooth' });\n  }\n\n  async clearConversation() {\n is-error');\n    this.status.textContent = '使用 SpinQ 本地模拟器，不会提交到量子真机。';\n  }\n\n  clear() {\n    this.reset();\n    this.setBusy(false);\n  }\n\n  showError(message) {\n    this.results.hidden = true;\n    this.status.classList.add('is-error');\n    this.status.textContent = message;\n  }\n\n  setBusy(busy) {\n    this.button.disabled = busy;\n    this.shots.disabled = busy;\n    this.button.firstChild.textContent = busy ? '运行中 ' : '运行测量 ';\n  }\n}\n\n\n// Source: starter_kit/web/js/circuit-visualizer.js\n// Lightweight OpenQASM 2.0 circuit parser and DOM renderer for the workspace.\n\nconst MAX_QUBITS = 32;\nconst MAX_OPERATIONS = 72;\nconst ROW_HEIGHT = 64;\nconst COLUMN_HEAD = 38;\n\nfunction parseQasmCircuit(qasm) {\n  if (typeof qasm !== 'string' || !qasm.trim()) {\n    throw new Error('缺少可绘制的 QASM');\n  }\n\n  const source = qasm\n    .replace(/\\/\\*[\\s\\S]*?\\*\\//g, '')\n    .replace(/\\/\\/.*$/gm, '');\n  const statements = source\n    .split(';')\n    .map((statement) => statement.replace(/\\s+/g, ' ').trim())\n    .filter(Boolean);\n  const quantumRegisters = new Map();\n  const classicalRegisters = new Map();\n\n  statements.forEach((statement) => {\n    const quantum = statement.match(/^qreg\\s+([A-Za-z_]\\w*)\\[(\\d+)\\]$/i);\n    if (quantum) quantumRegisters.set(quantum[1], Number(quantum[2]));\n    const classical = statement.match(/^creg\\s+([A-Za-z_]\\w*)\\[(\\d+)\\]$/i);\n    if (classical) classicalRegisters.set(classical[1], Number(classical[2]));\n  });\n\n  const qubits = [];\n  quantumRegisters.forEach((size, name) => {\n    for (let index = 0; index < size; index += 1) qubits.push(`${name}[${index}]`);\n  });\n  const operations = [];\n\n  statements.forEach((statement) => {\n    if (/^(OPENQASM|include|qreg|creg|gate|opaque)\\b/i.test(statement)) return;\n\n    const measurement = statement.match(/^measure\\s+(.+?)\\s*->\\s*(.+)$/i);\n    if (measurement) {\n      const targets = resolveOperand(measurement[1], quantumRegisters);\n      const classical = resolveOperand(measurement[2], classicalRegisters);\n      if (targets.length) {\n        operations.push({ gate: 'measure', targets, classical, source: statement });\n      }\n      return;\n    }\n\n    const barrier = statement.match(/^barrier\\s+(.+)$/i);\n    if (barrier) {\n      const targets = resolveOperands(barrier[1], quantumRegisters);\n      operations.push({ gate: 'barrier', targets: targets.length ? targets : qubits, source: statement });\n      return;\n    }\n\n    const operation = statement.match(/^([A-Za-z_]\\w*)\\s*(?:\\(([^)]*)\\))?\\s+(.+)$/);\n    if (!operation) return;\n    const targets = resolveOperands(operation[3], quantumRegisters);\n    if (!targets.length) return;\n    operations.push({\n      gate: operation[1].toLowerCase(),\n      parameters: operation[2]?.trim() || '',\n      targets,\n      source: statement,\n    });\n  });\n\n  const visibleQubits = qubits.slice(0, MAX_QUBITS);\n  const visibleRows = new Set(visibleQubits);\n  return {\n    qubits: visibleQubits,\n    operations: operations\n      .filter((operation) => operation.targets.some((target) => visibleRows.has(target)))\n      .slice(0, MAX_OPERATIONS),\n    totalQubits: qubits.length,\n    totalOperations: operations.length,\n    truncated: qubits.length > MAX_QUBITS || operations.length > MAX_OPERATIONS,\n  };\n}\n\nfunction resolveOperands(value, registers) {\n  return value\n    .split(',')\n    .flatMap((operand) => resolveOperand(operand, registers));\n}\n\nfunction resolveOperand(value, registers) {\n  const operand = value.trim();\n  const indexed = operand.match(/^([A-Za-z_]\\w*)\\[(\\d+)\\]$/);\n  if (indexed) {\n    const size = registers.get(indexed[1]);\n    const index = Number(indexed[2]);\n    return Number.isInteger(size) && index >= 0 && index < size\n      ? [`${indexed[1]}[${index}]`]\n      : [];\n  }\n  const size = registers.get(operand);\n  if (!Number.isInteger(size)) return [];\n  return Array.from({ length: size }, (_, index) => `${operand}[${index}]`);\n}\n\nclass CircuitVisualizer {\n  constructor(root) {\n    this.root = root;\n    this.empty = root.querySelector('#circuit-empty');\n    this.view = root.querySelector('#circuit-view');\n    this.scroll = root.querySelector('#circuit-scroll');\n    this.summary = root.querySelector('#circuit-summary');\n    this.name = root.querySelector('#circuit-name');\n    this.version = root.querySelector('#circuit-version');\n  }\n\n  render(qasm, artifact = {}) {\n    let circuit;\n    try {\n      circuit = parseQasmCircuit(qasm);\n    } catch (_error) {\n      this.showEmpty('暂无法绘制当前电路');\n      return;\n    }\n    if (!circuit.qubits.length) {\n      this.showEmpty('当前 QASM 没有量子寄存器');\n      return;\n    }\n\n    this.empty.hidden = true;\n    this.view.hidden = false;\n    this.summary.hidden = false;\n    this.name.textContent = compactGoal(artifact.goal) || inferCircuitName(circuit);\n    this.version.textContent = artifact.version ? `v${artifact.version}` : '';\n    this.summary.replaceChildren(\n      createSummaryItem(`${circuit.totalQubits} 比特`),\n      createSummaryItem(`${circuit.totalOperations} 个操作`),\n    );\n    this.scroll.replaceChildren(createCircuitDiagram(circuit));\n    this.scroll.scrollLeft = 0;\n    this.root.classList.remove('is-empty');\n    this.root.classList.add('has-circuit');\n    this.root.dispatchEvent(new CustomEvent('loomq:circuit-ready'));\n  }\n\n  clear() {\n    this.scroll.replaceChildren();\n    this.summary.replaceChildren();\n    this.summary.hidden = true;\n    this.view.hidden = true;\n    this.version.textContent = '';\n    this.empty.querySelector('strong').textContent = '等待当前电路';\n    this.empty.hidden = false;\n    this.root.classList.remove('has-circuit');\n    this.root.classList.add('is-empty');\n    this.root.dispatchEvent(new CustomEvent('loomq:circuit-clear'));\n  }\n\n  showEmpty(message) {\n    this.clear();\n    this.empty.querySelector('strong').textContent = message;\n  }\n}\n\nfunction createCircuitDiagram(circuit) {\n  const diagram = document.createElement('div');\n  diagram.className = 'circuit-diagram';\n  diagram.setAttribute('role', 'img');\n  diagram.setAttribute(\n    'aria-label',\n    `${circuit.totalQubits} 个量子比特、${circuit.totalOperations} 个操作的量子电路`,\n  );\n\n  const labels = document.createElement('div');\n  labels.className = 'circuit-labels';\n  const labelHead = document.createElement('span');\n  labelHead.className = 'circuit-label-head';\n  labelHead.textContent = 'QUBIT';\n  labels.append(labelHead);\n  circuit.qubits.forEach((qubit) => {\n    const label = document.createElement('div');\n    label.className = 'circuit-qubit-label';\n    const name = document.createElement('strong');\n    name.textContent = qubit;\n    const state = document.createElement('span');\n    state.textContent = '|0⟩';\n    label.append(name, state);\n    labels.append(label);\n  });\n\n  const operations = document.createElement('div');\n  operations.className = 'circuit-operations';\n  circuit.operations.forEach((operation, index) => {\n    operations.append(createOperationColumn(operation, index, circuit.qubits));\n  });\n  if (!circuit.operations.length) {\n    const idle = document.createElement('div');\n    idle.className = 'circuit-idle-column';\n    idle.textContent = '尚无量子门';\n    operations.append(idle);\n  }\n\n  diagram.append(labels, operations);\n  if (circuit.truncated) {\n    const notice = document.createElement('p');\n    notice.className = 'circuit-truncated';\n    notice.textContent = '电路较大，当前显示前 32 个比特和前 72 个操作。';\n    diagram.append(notice);\n  }\n  return diagram;\n}\n\nfunction createOperationColumn(operation, index, qubits) {\n  const rowByQubit = new Map(qubits.map((label, row) => [label, row]));\n  const rows = operation.targets\n    .map((target) => rowByQubit.get(target))\n    .filter((row) => Number.isInteger(row));\n  const column = document.createElement('div');\n  column.className = `circuit-operation operation-${operation.gate}`;\n  column.style.height = `${COLUMN_HEAD + qubits.length * ROW_HEIGHT}px`;\n  column.title = operation.source;\n  column.setAttribute('aria-label', operation.source);\n\n  const number = document.createElement('span');\n  number.className = 'operation-number';\n  number.textContent = String(index + 1).padStart(2, '0');\n  column.append(number);\n\n  qubits.forEach((_qubit, row) => {\n    const wire = document.createElement('i');\n    wire.className = 'circuit-wire';\n    wire.style.top = `${rowCenter(row)}px`;\n    column.append(wire);\n  });\n\n  if (operation.gate === 'barrier') {\n    if (rows.length) column.append(createConnector(Math.min(...rows), Math.max(...rows), true));\n    return column;\n  }\n\n  if (operation.gate === 'measure') {\n    rows.forEach((row, targetIndex) => {\n      const classical = operation.classical?.[targetIndex] || '';\n      column.append(createGateNode(row, 'M', 'measurement-gate', classical ? `→ ${classical}` : ''));\n    });\n    return column;\n  }\n\n  if (operation.gate === 'cx' || operation.gate === 'cnot') {\n    appendControlledGate(column, rows, '⊕', 'target-gate');\n    return column;\n  }\n  if (operation.gate === 'cz') {\n    appendControlledGate(column, rows, 'Z', 'gate-box controlled-target');\n    return column;\n  }\n  if (operation.gate === 'ccx') {\n    appendMultiControlledGate(column, rows, '⊕');\n    return column;\n  }\n  if (operation.gate === 'swap') {\n    appendSwapGate(column, rows);\n    return column;\n  }\n  if (operation.gate === 'cswap') {\n    if (rows.length >= 3) {\n      column.append(createConnector(Math.min(...rows), Math.max(...rows)));\n      column.append(createGateNode(rows[0], '', 'control-gate'));\n      column.append(createGateNode(rows[1], '×', 'swap-gate'));\n      column.append(createGateNode(rows[2], '×', 'swap-gate'));\n    }\n    return column;\n  }\n  if (operation.gate.startsWith('c') && rows.length >= 2) {\n    appendControlledGate(column, rows, gateLabel(operation.gate.slice(1)), 'gate-box controlled-target', operation.parameters);\n    return column;\n  }\n\n  const label = gateLabel(operation.gate);\n  rows.forEach((row) => column.append(createGateNode(row, label, 'gate-box', operation.parameters)));\n  if (rows.length > 1 && !isRegisterWideSingleGate(operation.gate)) {\n    column.append(createConnector(Math.min(...rows), Math.max(...rows)));\n  }\n  return column;\n}\n\nfunction appendControlledGate(column, rows, targetLabel, targetClass, detail = '') {\n  if (rows.length < 2) return;\n  column.append(createConnector(Math.min(rows[0], rows[1]), Math.max(rows[0], rows[1])));\n  column.append(createGateNode(rows[0], '', 'control-gate'));\n  column.append(createGateNode(rows[1], targetLabel, targetClass, detail));\n}\n\nfunction appendMultiControlledGate(column, rows, targetLabel) {\n  if (rows.length < 3) return;\n  column.append(createConnector(Math.min(...rows), Math.max(...rows)));\n  rows.slice(0, -1).forEach((row) => column.append(createGateNode(row, '', 'control-gate')));\n  column.append(createGateNode(rows.at(-1), targetLabel, 'target-gate'));\n}\n\nfunction appendSwapGate(column, rows) {\n  if (rows.length < 2) return;\n  column.append(createConnector(Math.min(rows[0], rows[1]), Math.max(rows[0], rows[1])));\n  column.append(createGateNode(rows[0], '×', 'swap-gate'));\n  column.append(createGateNode(rows[1], '×', 'swap-gate'));\n}\n\nfunction createConnector(firstRow, lastRow, barrier = false) {\n  const connector = document.createElement('i');\n  connector.className = barrier ? 'gate-connector barrier-connector' : 'gate-connector';\n  connector.style.top = `${rowCenter(firstRow)}px`;\n  connector.style.height = `${Math.max(1, (lastRow - firstRow) * ROW_HEIGHT)}px`;\n  return connector;\n}\n\nfunction createGateNode(row, label, className, detail = '') {\n  const node = document.createElement('span');\n  node.className = `circuit-gate ${className}`;\n  node.style.top = `${rowCenter(row)}px`;\n  if (label) {\n    const main = document.createElement('b');\n    main.textContent = label;\n    node.append(main);\n  }\n  if (detail) {\n    const small = document.createElement('small');\n    small.textContent = detail;\n    node.append(small);\n    node.title = detail;\n  }\n  return node;\n}\n\nfunction rowCenter(row) {\n  return COLUMN_HEAD + row * ROW_HEIGHT + ROW_HEIGHT / 2;\n}\n\nfunction gateLabel(gate) {\n  const labels = { id: 'I', u: 'U', u1: 'U1', u2: 'U2', u3: 'U3', rx: 'RX', ry: 'RY', rz: 'RZ', p: 'P', sx: '√X' };\n  return labels[gate] || gate.toUpperCase();\n}\n\nfunction isRegisterWideSingleGate(gate) {\n  return ['id', 'x', 'y', 'z', 'h', 's', 'sdg', 't', 'tdg', 'rx', 'ry', 'rz', 'u', 'u1', 'u2', 'u3', 'p', 'sx'].includes(gate);\n}\n\nfunction compactGoal(goal) {\n  if (typeof goal !== 'string') return '';\n  const compact = goal.replace(/\\s+/g, ' ').trim();\n  return compact.length > 46 ? `${compact.slice(0, 46)}…` : compact;\n}\n\nfunction inferCircuitName(circuit) {\n  const gates = circuit.operations.map((operation) => operation.gate);\n  if (gates.includes('h') && gates.filter((gate) => gate === 'cx').length >= 2) return 'GHZ 电路';\n  if (gates.includes('h') && gates.includes('cx')) return 'Bell 电路';\n  return '量子电路';\n}\n\nfunction createSummaryItem(text) {\n  const item = document.createElement('span');\n  item.textContent = text;\n  return item;\n}\n\n\n// Source: starter_kit/web/js/conversation-session.js\n// Browser-side pointer to server-owned conversation and active circuit state.\n\nclass ConversationSession {\n  constructor(storage = window.sessionStorage) {\n    // Conversation pointers are intentionally memory-only. Remove data written\n    // by older versions so reopening the page always starts a fresh session.\n    storage.removeItem('loomq.conversationSession');\n    this.state = { conversationId: null, artifact: null };\n  }\n\n  requestContext() {\n    const payload = {};\n    if (this.state.conversationId) payload.conversation_id = this.state.conversationId;\n    if (this.state.artifact?.id) {\n      payload.active_artifact_id = this.state.artifact.id;\n      payload.expected_version = this.state.artifact.version;\n    }\n    return payload;\n  }\n\n  update(response) {\n    this.state = {\n      conversationId: response.conversation_id || this.state.conversationId || null,\n      artifact: response.active_artifact || null,\n    };\n    return this.state;\n  }\n\n  clear() {\n    this.state = { conversationId: null, artifact: null };\n  }\n}\n\n\n// Source: starter_kit/web/js/journey.js\n// Visual narrative progress for an Agent request.\n\nclass JourneyProgress {\n  constructor(root = document) {\n    this.steps = root.querySelectorAll('[data-journey-step]');\n    this.progress = root.querySelector('.journey-line span');\n  }\n\n  setActive(activeIndex) {\n    this.steps.forEach((step) => {\n      const index = Number(step.dataset.journeyStep);\n      step.classList.toggle('is-active', index === activeIndex);\n      step.classList.toggle('is-complete', index < activeIndex);\n    });\n    if (this.progress && this.steps.length > 1) {\n      const percent = Math.max(0, activeIndex / (this.steps.length - 1)) * 100;\n      this.progress.style.width = `${percent}%`;\n    }\n  }\n}\n\n\n// Source: starter_kit/web/js/preferences.js\n// Device-local onboarding and explanation preferences.\n\nconst KEYS = Object.freeze({\n  profile: 'loomq.quantumProfile',\n  explainConcepts: 'loomq.explainConcepts',\n  onboardingComplete: 'loomq.onboardingComplete',\n});\n\nconst PROFILE_MODULES = Object.freeze({\n  new: Object.freeze({ conceptBasics: true, exampleCircuit: true }),\n  some: Object.freeze({ conceptBasics: false, exampleCircuit: true }),\n  expert: Object.freeze({ conceptBasics: false, exampleCircuit: false }),\n});\n\nclass PreferenceStore {\n  constructor(storage = window.localStorage) {\n    this.storage = storage;\n  }\n\n  getLearningPreferences() {\n    const profile = this.get(KEYS.profile) || '';\n    const modules = this.modulesForProfile(profile);\n    return {\n      profile,\n      explainConcepts: modules.conceptBasics,\n      ...modules,\n    };\n  }\n\n  modulesForProfile(profile) {\n    return PROFILE_MODULES[profile] || { conceptBasics: false, exampleCircuit: false };\n  }\n\n  saveLearningPreferences(profile) {\n    const modules = this.modulesForProfile(profile);\n    this.set(KEYS.profile, profile);\n    this.set(KEYS.explainConcepts, String(modules.conceptBasics));\n    return modules;\n  }\n\n  isOnboardingComplete() {\n    return this.get(KEYS.onboardingComplete) === 'true';\n  }\n\n  markOnboardingComplete() {\n    this.set(KEYS.onboardingComplete, 'true');\n  }\n\n  get(key) {\n    try {\n      return this.storage.getItem(key);\n    } catch (_error) {\n      return null;\n    }\n  }\n\n  set(key, value) {\n    try {\n      this.storage.setItem(key, value);\n    } catch (_error) {\n      // Preferences are optional; the app remains usable without browser storage.\n    }\n  }\n}\n\n\n// Source: starter_kit/web/js/workspace.js\n// Workspace composition root: conversation, circuit context, and config gate.\n\n\n\n\n\n\n\n\nconst preferences = new PreferenceStore();\nconst conversationSession = new ConversationSession();\nconst journey = new JourneyProgress();\nconst circuitVisualizer = new CircuitVisualizer(document.querySelector('#circuit-panel'));\nconst circuitRunner = new CircuitRunner({\n  root: document.querySelector('#circuit-panel'),\n  api,\n  conversationSession,\n});\n\nconst configurationGate = {\n  ready: false,\n  isReady() {\n    return this.ready;\n  },\n  open() {\n    window.parent.postMessage({type:'loomq:navigate',page:'home'}, '*');\n  },\n};\n\nasync function startWorkspace() {\n  try {\n    const configuration = await api.getConfiguration();\n    if (!configuration.ready) {\n      window.parent.postMessage({type:'loomq:navigate',page:'home'}, '*');\n      return;\n    }\n    configurationGate.ready = true;\n  } catch (_error) {\n    window.parent.postMessage({type:'loomq:navigate',page:'home'}, '*');\n    return;\n  }\n\n  const chat = new ChatController({\n    api,\n    preferences,\n    onboarding: configurationGate,\n    journey,\n    conversationSession,\n    circuitVisualizer,\n  });\n  circuitRunner.init();\n  chat.init();\n  chat.focus();\n}\n\nstartWorkspace();\n\ndocument.querySelectorAll('[data-demo-home]').forEach(link => link.addEventListener('click', event => { event.preventDefault(); window.parent.postMessage({type:'loomq:navigate',page:'home'}, '*'); }));\n<\/script>\n<\/body>\n<\/html>\n"};
