<text x="86" y="31.5" font-family="Consolas,monospace" font-size="13" fill="#8b98ab">cli-demo-three-tasks.py</text>
<g font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#d8dee9" xml:space="preserve">
<text x="24" y="66" fill="#d8dee9"></text>
<text x="24" y="83" fill="#ffd166">—— ① 自然语言生成电路 ——</text>
<text x="24" y="100" fill="#d8dee9">你：帮我生成一个 3 比特 GHZ 最大纠缠态并进行全测量</text>
<text x="24" y="117" fill="#d8dee9">…</text>
<text x="24" y="134" fill="#a5d6ff">已生成 3 比特 电路（来源：template，自验：distribution matches ideal (ghz)）</text>
<text x="24" y="151" fill="#d8dee9"></text>
<text x="24" y="168" fill="#d8dee9">```qasm</text>
<text x="24" y="185" fill="#d8dee9">OPENQASM 2.0;</text>
<text x="24" y="202" fill="#d8dee9">include &quot;qelib1.inc&quot;;</text>
<text x="24" y="219" fill="#d8dee9">qreg q[3];</text>
<text x="24" y="236" fill="#d8dee9">creg c[3];</text>
<text x="24" y="253" fill="#d8dee9">h q[0];</text>
<text x="24" y="270" fill="#d8dee9">cx q[0], q[1];</text>
<text x="24" y="287" fill="#d8dee9">cx q[1], q[2];</text>
<text x="24" y="304" fill="#d8dee9">measure q -&gt; c;</text>
<text x="24" y="321" fill="#d8dee9">```</text>
<text x="24" y="338" fill="#d8dee9"></text>
<text x="24" y="355" fill="#d8dee9">  测量结果分布（2048 shots）：</text>
<text x="24" y="372" fill="#79c0ff">  111      51.0%  ████████████</text>
<text x="24" y="389" fill="#79c0ff">  000      49.0%  ████████████</text>
<text x="24" y="406" fill="#d8dee9"></text>
<text x="24" y="423" fill="#d8dee9"></text>
<text x="24" y="440" fill="#ffd166">—— ② 智能修复报错代码 ——</text>
<text x="24" y="457" fill="#d8dee9">你：我想制备一个贝尔态，但这段代码报错了，帮我修好：H q[0]; CX q[0] q[1]（未定义寄存器且门名大小写错误）</text>
<text x="24" y="474" fill="#d8dee9">…</text>
<text x="24" y="491" fill="#d8dee9">已修复 2 比特 电路（来源：intent-template，自验：distribution matches ideal (bell)）</text>
<text x="24" y="508" fill="#d8dee9"></text>
<text x="24" y="525" fill="#d8dee9">```qasm</text>
<text x="24" y="542" fill="#d8dee9">OPENQASM 2.0;</text>
<text x="24" y="559" fill="#d8dee9">include &quot;qelib1.inc&quot;;</text>
<text x="24" y="576" fill="#d8dee9">qreg q[2];</text>
<text x="24" y="593" fill="#d8dee9">creg c[2];</text>
<text x="24" y="610" fill="#d8dee9">h q[0];</text>
<text x="24" y="627" fill="#d8dee9">cx q[0], q[1];</text>
<text x="24" y="644" fill="#d8dee9">measure q -&gt; c;</text>
<text x="24" y="661" fill="#d8dee9">```</text>
<text x="24" y="678" fill="#d8dee9"></text>
<text x="24" y="695" fill="#d8dee9">  测量结果分布（2048 shots）：</text>
<text x="24" y="712" fill="#79c0ff">  00       50.1%  ████████████</text>
<text x="24" y="729" fill="#79c0ff">  11       49.9%  ████████████</text>
<text x="24" y="746" fill="#d8dee9"></text>
<text x="24" y="763" fill="#d8dee9"></text>
<text x="24" y="780" fill="#ffd166">—— ③ 智能选择后端 ——</text>
<text x="24" y="797" fill="#d8dee9">你：我需要运行一个 15 比特电路，而且要求零排队等待、完全免费，选哪个平台？</text>
<text x="24" y="814" fill="#d8dee9">…</text>
<text x="24" y="831" fill="#a5d6ff">推荐后端：originq_local_simulator</text>
<text x="24" y="848" fill="#d8dee9">同样满足条件的候选：braket_local_simulator, spinq_taurus_simulator</text>
<text x="24" y="865" fill="#d8dee9">上限受本机内存约束，30 为评测基准值；可接悟空真机 72 比特：容量 30 比特，排队情况 none，费用 free，无需排队即可本地运行。</text>
</g></svg>