<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantumHelper · 检查线路</title>
<link rel="stylesheet" href="styles.css">
<style>
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.status-card{padding:17px;border:1px solid rgba(25,26,30,.07);border-radius:14px;background:rgba(255,255,255,.64)}.status-card.ok{border-color:rgba(99,130,113,.18);background:var(--green-soft)}.status-card span{color:var(--text-2);font-size:12px}.status-card strong{display:block;margin-top:7px;font-size:15px}
.code-summary{margin-top:18px;padding:18px;border:1px solid var(--primary-line);border-radius:15px;background:rgba(255,255,255,.65);font-family:"SFMono-Regular",Consolas,monospace;font-size:13px;line-height:1.7}
@media(max-width:760px){.status{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <a class="brand" href="index.html"><div class="logo"><span></span></div>QuantumHelper</a>
  <div class="top-meta"><span>已有量子线路</span><span class="mode"><i class="mode-dot"></i>任务引导</span></div>
</header><nav class="progress cols-5" aria-label="流程"><div class="progress-step done"><i>✓</i>导入线路</div><div class="progress-step active"><i>2</i>检查线路</div><div class="progress-step"><i>3</i>选择后端</div><div class="progress-step"><i>4</i>运行</div><div class="progress-step"><i>5</i>结果</div></nav>

<section class="hero">
  <div class="eyebrow">检查 · 第 2 步</div>
  <h1>线路可以继续，<span class="hero-em">先看关键结构</span></h1>
  <p class="hero-text">检查页只告诉你能不能跑、规模多大、有没有测量，不把输入代码整页复读。</p>
</section>
<main><section class="layout"><article class="card main-card"><div class="section-head"><div class="kicker">检查结果</div><h2 class="section-title">线路结构没有发现阻塞问题</h2></div><div class="section-body"><div class="status"><div class="status-card ok"><span>语法</span><strong>可识别</strong></div><div class="status-card ok"><span>测量</span><strong id="measureStatus">已包含</strong></div><div class="status-card"><span>量子比特</span><strong id="qcount">2</strong></div></div><div class="code-summary" id="summary">H · CX · Measure</div></div></article><aside class="card side-card"><div class="kicker">线路摘要</div><h2 class="side-title">下一步只需要选运行环境</h2><div class="summary-list"><div class="summary-item"><span class="summary-name">量子比特</span><span class="summary-value" id="sq">2</span></div><div class="summary-item"><span class="summary-name">双比特操作</span><span class="summary-value" id="two">1</span></div><div class="summary-item"><span class="summary-name">测量</span><span class="summary-value" id="sm">1</span></div></div><div class="action-block"><a class="btn primary" href="backend.html?source=import">选择运行后端 →</a><a class="btn secondary" href="circuit-import.html">返回修改线路</a></div></aside></section></main></div>
<script>
const t=localStorage.getItem('qh_qasm')||'',m=t.match(/qubit\[(\d+)\]/i)||t.match(/qreg\s+\w+\[(\d+)\]/i),q=m?m[1]:'?';const meas=(t.match(/measure/gi)||[]).length,two=(t.match(/\bcx\b/gi)||[]).length+(t.match(/cnot/gi)||[]).length;
qcount.textContent=sq.textContent=q;two.textContent=two;sm.textContent=meas||'0';measureStatus.textContent=meas?'已包含':'未发现';localStorage.setItem('qh_import_qubits',q);
</script></body>
</html>
