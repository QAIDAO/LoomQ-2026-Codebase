<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantumHelper · 生成方案</title>
<link rel="stylesheet" href="styles.css">
<style>
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.plan-step{min-height:176px;padding:20px;border:1px solid rgba(25,26,30,.07);border-radius:16px;background:rgba(255,255,255,.68)}.plan-no{color:var(--primary);font-size:12px;font-weight:820}.plan-step h3{margin:24px 0 8px;font-size:18px}.plan-step p{margin:0;color:var(--text);font-size:13px;line-height:1.65}
.method{margin-top:16px;padding:20px;border:1px solid var(--primary-line);border-radius:16px;background:linear-gradient(180deg,rgba(94,99,182,.07),rgba(255,255,255,.82))}.method-name{font-size:20px;font-weight:760}.method p{margin:10px 0 0;color:var(--text);font-size:14px;line-height:1.68}
@media(max-width:760px){.plan-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <a class="brand" href="index.html"><div class="logo"><span></span></div>QuantumHelper</a>
  <div class="top-meta"><span>自己的任务</span><span class="mode"><i class="mode-dot"></i>任务引导</span></div>
</header><nav class="progress cols-6" aria-label="流程"><div class="progress-step done"><i>✓</i>描述任务</div><div class="progress-step active"><i>2</i>生成方案</div><div class="progress-step"><i>3</i>确认线路</div><div class="progress-step"><i>4</i>选择后端</div><div class="progress-step"><i>5</i>运行</div><div class="progress-step"><i>6</i>结果</div></nav>

<section class="hero">
  <div class="eyebrow">方案 · 第 2 步</div>
  <h1>把任务拆成<span class="hero-em">可以执行的量子步骤</span></h1>
  <p class="hero-text">先看“怎么做”，再看具体量子门。方案不合适时，可以返回修改任务。</p>
</section>
<main><section class="layout"><article class="card main-card"><div class="section-head"><div class="kicker">方案结构</div><h2 class="section-title" id="planTitle"></h2></div><div class="section-body"><div class="plan-grid"><div class="plan-step"><div class="plan-no">01</div><h3 id="s1t"></h3><p id="s1d"></p></div><div class="plan-step"><div class="plan-no">02</div><h3 id="s2t"></h3><p id="s2d"></p></div><div class="plan-step"><div class="plan-no">03</div><h3 id="s3t"></h3><p id="s3d"></p></div></div><div class="method"><div class="kicker">建议方法</div><div class="method-name" id="method"></div><p id="methodDesc"></p></div></div></article><aside class="card side-card"><div class="kicker">当前任务</div><h2 class="side-title" id="taskText"></h2><div class="summary-list"><div class="summary-item"><span class="summary-name">类型</span><span class="summary-value" id="taskType"></span></div><div class="summary-item"><span class="summary-name">输出</span><span class="summary-value" id="taskOutput"></span></div></div><div class="action-block"><a class="btn primary" href="custom-circuit.html">确认方案，生成线路 →</a><a class="btn secondary" href="custom-task.html">返回修改任务</a></div></aside></section></main></div>
<script>
const type=localStorage.getItem('qh_type')||'查找';
const cfg={
'查找':{title:'把搜索任务拆成三个动作',s1:['表示候选','用量子状态表示候选范围。'],s2:['标记目标','把满足条件的候选和其他状态区分开。'],s3:['放大并测量','提高目标出现概率，再通过测量读取结果。'],method:'Grover-style Search',desc:'适合演示在多个候选中寻找满足条件的目标。小规模示例用于说明流程，不默认宣称真实业务一定获得量子优势。'},
'优化':{title:'把优化任务拆成目标、约束和比较',s1:['编码方案','把不同候选方案表示成可比较的状态。'],s2:['写入目标','把冲突、成本或收益转换成评分目标。'],s3:['反复调整','运行参数化线路并比较结果，寻找更优候选。'],method:'QAOA-style Optimization',desc:'适合演示小规模组合优化问题。'},
'测量':{title:'已有线路时，重点是确认运行和读取方式',s1:['确认线路','检查输入线路和量子比特数量。'],s2:['选择运行','先使用模拟器重复执行。'],s3:['统计分布','汇总测量结果并比较出现频率。'],method:'Direct Circuit Execution',desc:'这个任务不需要重新寻找算法，重点是把已有线路可靠地运行并读取结果。'},
'关联':{title:'把关联任务拆成准备、连接和验证',s1:['准备状态','让参与实验的量子比特进入所需初始状态。'],s2:['建立关联','使用两比特操作把状态联系起来。'],s3:['验证结果','重复测量，观察相关结果是否稳定出现。'],method:'Entanglement-style Circuit',desc:'适合演示多个量子比特之间的测量关联。'}
}[type];
planTitle.textContent=cfg.title;[s1t,s1d,s2t,s2d,s3t,s3d].forEach(()=>{});
s1t.textContent=cfg.s1[0];s1d.textContent=cfg.s1[1];s2t.textContent=cfg.s2[0];s2d.textContent=cfg.s2[1];s3t.textContent=cfg.s3[0];s3d.textContent=cfg.s3[1];method.textContent=cfg.method;methodDesc.textContent=cfg.desc;taskText.textContent=localStorage.getItem('qh_task')||'你的任务';taskType.textContent=type;taskOutput.textContent=localStorage.getItem('qh_output')||'结果';localStorage.setItem('qh_method',cfg.method);
</script></body>
</html>
