<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantumHelper · 示例任务</title>
<link rel="stylesheet" href="styles.css">
<style>
.preview{padding:24px;border:1px solid var(--primary-line);border-radius:18px;background:linear-gradient(180deg,rgba(94,99,182,.06),rgba(255,255,255,.84))}
.chart{height:240px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:end;padding:24px 18px 38px}
.bar-wrap{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}.bar{width:60%;border-radius:10px 10px 4px 4px;background:rgba(94,99,182,.18)}.bar.major{background:linear-gradient(180deg,#767bc8,var(--primary))}.lab{position:absolute;bottom:-26px;font-size:13px;font-weight:760}
.bar-00{height:78%}.bar-01{height:18%}.bar-10{height:16%}.bar-11{height:75%}
.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.insight{padding:14px;border:1px solid rgba(25,26,30,.07);border-radius:13px;background:rgba(255,255,255,.65)}.insight span{display:block;color:var(--text-2);font-size:11px}.insight strong{display:block;margin-top:5px;font-size:14px}
@media(max-width:760px){.insights{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <a class="brand" href="index.html"><div class="logo"><span></span></div>QuantumHelper</a>
  <div class="top-meta"><span>示例任务</span><span class="mode"><i class="mode-dot"></i>任务引导</span></div>
</header><nav class="progress cols-4" aria-label="流程"><div class="progress-step active"><i>1</i>理解任务</div><div class="progress-step"><i>2</i>查看线路</div><div class="progress-step"><i>3</i>运行实验</div><div class="progress-step"><i>4</i>读取结果</div></nav>

<section class="hero">
  <div class="eyebrow">示例任务 · 关联</div>
  <h1>让两个量子比特产生<span class="hero-em">关联</span></h1>
  <p class="hero-text">先看结果会呈现什么规律，再进入线路。这里不要求你先认识算法或量子门。</p>
</section>
<main><section class="layout">
<article class="card main-card"><div class="section-head"><div class="kicker">这次要观察什么</div><h2 class="section-title">重复测量后，哪些结果会更常出现？</h2></div><div class="section-body"><div class="preview"><div class="kicker">结果预览</div><div class="chart"><div class="bar-wrap"><div class="bar major bar-00"></div><span class="lab">00</span></div><div class="bar-wrap"><div class="bar bar-01"></div><span class="lab">01</span></div><div class="bar-wrap"><div class="bar bar-10"></div><span class="lab">10</span></div><div class="bar-wrap"><div class="bar major bar-11"></div><span class="lab">11</span></div></div></div><div class="insights"><div class="insight"><span>横轴</span><strong>四种测量结果</strong></div><div class="insight"><span>柱高</span><strong>出现频率</strong></div><div class="insight"><span>本次关注</span><strong>00 与 11</strong></div></div></div></article>
<aside class="card side-card"><div class="kicker">本次已准备</div><h2 class="side-title">直接开始，不用先配参数</h2><div class="summary-list"><div class="summary-item"><span class="summary-name">量子比特</span><span class="summary-value">2</span></div><div class="summary-item"><span class="summary-name">运行方式</span><span class="summary-value">本地模拟器</span></div><div class="summary-item"><span class="summary-name">测量次数</span><span class="summary-value">1024</span></div></div><div class="action-block"><a class="btn primary" href="example-circuit.html">开始看线路 →</a><a class="btn secondary" href="index.html">返回首页</a></div></aside>
</section></main></div>
<script></script></body>
</html>
