<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantumHelper · 任务结果</title>
<link rel="stylesheet" href="styles.css">
<style>
.chartbox{padding:22px;border:1px solid var(--primary-line);border-radius:17px;background:linear-gradient(180deg,rgba(94,99,182,.05),rgba(255,255,255,.84))}
.chart{height:260px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:end;padding:18px 12px 38px}.barwrap{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}.bar{width:58%;min-height:3px;border-radius:10px 10px 4px 4px;background:rgba(94,99,182,.18)}.bar.major{background:linear-gradient(180deg,#767bc8,var(--primary));box-shadow:0 10px 22px rgba(94,99,182,.15)}.lab{position:absolute;bottom:-26px;font-size:12px;font-weight:760}
.reading{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:16px}.reading>div{padding:17px;border:1px solid rgba(25,26,30,.07);border-radius:14px;background:rgba(255,255,255,.64)}.reading .main{border-color:var(--primary-line);background:var(--primary-soft)}.reading strong{display:block;margin-bottom:6px;font-size:15px}.reading span{color:var(--text);font-size:13px;line-height:1.6}
@media(max-width:760px){.reading{grid-template-columns:1fr}.chart{gap:10px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <a class="brand" href="index.html"><div class="logo"><span></span></div>QuantumHelper</a>
  <div class="top-meta"><span>自己的任务</span><span class="mode"><i class="mode-dot"></i>任务引导</span></div>
</header><nav class="progress cols-6" aria-label="流程"><div class="progress-step done"><i>✓</i>描述任务</div><div class="progress-step done"><i>✓</i>生成方案</div><div class="progress-step done"><i>✓</i>确认线路</div><div class="progress-step done"><i>✓</i>选择后端</div><div class="progress-step done"><i>✓</i>运行</div><div class="progress-step active"><i>6</i>结果</div></nav>

<section class="hero">
  <div class="eyebrow">结果</div>
  <h1>真实结果返回后，<span class="hero-em">再读取有依据的结论</span></h1>
  <p class="hero-text">图表和解释都以本次真实测量数据为准；没有数据时保持空态。</p>
</section>
<main><section class="layout"><article class="card main-card"><div class="section-head"><div class="kicker">结果摘要</div><h2 class="section-title" id="resultTitle">尚无真实运行结果</h2></div><div class="section-body"><div class="chartbox"><div class="chart"><p class="small-copy">请先完成任务运行；真实 counts 返回后将在这里生成图表。</p></div></div><div class="reading"><div class="main"><strong>结果说明</strong><span id="meaning">真实结果返回后，QuantumHelper 会根据实际测量分布说明可以直接观察到什么。</span></div><div><strong>任务类型</strong><span id="typeText">—</span></div></div></div></article><aside class="card side-card"><div class="kicker">任务摘要</div><h2 class="side-title" id="taskText">等待真实数据</h2><div class="summary-list"><div class="summary-item"><span class="summary-name">方法</span><span class="summary-value" id="method">—</span></div><div class="summary-item"><span class="summary-name">后端</span><span class="summary-value" id="backend2">—</span></div><div class="summary-item"><span class="summary-name">状态</span><span class="summary-value">尚未运行</span></div></div><div class="action-block"><a class="btn primary" href="custom-run.html">返回运行任务 →</a><a class="btn secondary" href="index.html">返回首页</a></div></aside></section></main></div>
</body>
</html>
