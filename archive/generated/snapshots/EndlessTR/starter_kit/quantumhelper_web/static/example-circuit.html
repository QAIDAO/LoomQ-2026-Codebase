<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantumHelper · 示例线路</title>
<link rel="stylesheet" href="styles.css">
<style>
.circuit{padding:28px;border:1px solid var(--primary-line);border-radius:18px;background:radial-gradient(circle at top left,rgba(94,99,182,.08),transparent 34%),rgba(255,255,255,.72)}
.wire-row{display:grid;grid-template-columns:58px 1fr;gap:18px;align-items:center;height:88px}.qname{font-size:13px;font-weight:760}.wire{position:relative;height:2px;background:rgba(39,41,109,.20)}
.gate{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;width:50px;height:50px;border:1px solid var(--primary-line);border-radius:13px;background:#fff;color:var(--primary-deep);font-weight:800;cursor:pointer}.gate:hover,.gate.selected{background:var(--primary-soft);border-color:var(--primary)}
.h{left:20%}.cx{left:53%}.m{left:84%}.cx.small{width:34px;height:34px;border-radius:50%}
.detail{padding:16px;border:1px solid var(--primary-line);border-radius:14px;background:var(--primary-soft);margin-top:18px}.detail h3{margin:0 0 6px;font-size:16px}.detail p{margin:0;color:var(--text);font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <a class="brand" href="index.html"><div class="logo"><span></span></div>QuantumHelper</a>
  <div class="top-meta"><span>示例任务</span><span class="mode"><i class="mode-dot"></i>任务引导</span></div>
</header><nav class="progress cols-4" aria-label="流程"><div class="progress-step done"><i>✓</i>理解任务</div><div class="progress-step active"><i>2</i>查看线路</div><div class="progress-step"><i>3</i>运行实验</div><div class="progress-step"><i>4</i>读取结果</div></nav>

<section class="hero">
  <div class="eyebrow">线路 · 第 2 步</div>
  <h1>这条线路只做三件事：<span class="hero-em">准备、关联、测量</span></h1>
  <p class="hero-text">点线路上的操作看它在做什么。你不需要先记住门名。</p>
</section>
<main><section class="layout"><article class="card main-card"><div class="section-head"><div class="kicker">线路总览</div><h2 class="section-title">两个量子比特从初始状态走到测量</h2></div><div class="section-body"><div class="circuit"><div class="wire-row"><div class="qname">q₀</div><div class="wire"><button class="gate h selected" data-k="H">H</button><button class="gate cx small" data-k="CX">●</button><button class="gate m" data-k="M">测量</button></div></div><div class="wire-row"><div class="qname">q₁</div><div class="wire"><button class="gate cx" data-k="CX">⊕</button><button class="gate m" data-k="M">测量</button></div></div></div><div class="detail"><h3 id="detailTitle">先让 q₀ 拥有两种可能</h3><p id="detailText">这一步为后面的两比特关联准备条件。</p></div></div></article><aside class="card side-card"><div class="kicker">线路摘要</div><h2 class="side-title">看作用，不背术语</h2><div class="summary-list"><div class="summary-item"><span class="summary-name">阶段</span><span class="summary-value">3</span></div><div class="summary-item"><span class="summary-name">量子比特</span><span class="summary-value">2</span></div></div><div class="action-block"><a class="btn primary" href="example-run.html">下一步：运行实验 →</a><a class="btn secondary" href="example-task.html">返回任务说明</a></div></aside></section></main></div>
<script>
const map={H:['先让 q₀ 拥有两种可能','这一步为后面的两比特关联准备条件。'],CX:['让 q₀ 影响 q₁','这一操作把两个量子比特联系起来，使它们不再像两个彼此独立的开关。'],M:['把量子状态变成可读结果','单次测量只得到一种结果，因此后面要重复运行并统计分布。']};
document.querySelectorAll('.gate').forEach(g=>g.onclick=()=>{document.querySelectorAll('.gate').forEach(x=>x.classList.remove('selected'));g.classList.add('selected');detailTitle.textContent=map[g.dataset.k][0];detailText.textContent=map[g.dataset.k][1]});
</script></body>
</html>
