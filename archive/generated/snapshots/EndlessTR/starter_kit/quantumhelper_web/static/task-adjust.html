<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantumHelper · 任务需要调整</title>
<link rel="stylesheet" href="styles.css">
<style>
.panel{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start;padding-bottom:72px}.main{padding:30px}.signal{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(154,122,69,.20);border-radius:15px;background:var(--amber-soft);color:var(--amber);font-size:22px;font-weight:800}.main h2{margin:20px 0 10px;font-size:26px;letter-spacing:-.025em}.main p{margin:0;max-width:62ch;color:var(--text);font-size:15px;line-height:1.7}.reasons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}.reason{padding:16px;border:1px solid rgba(25,26,30,.07);border-radius:14px;background:rgba(255,255,255,.64)}.reason strong{display:block;margin-bottom:6px;font-size:14px}.reason span{color:var(--text-2);font-size:13px;line-height:1.55}
@media(max-width:860px){.panel{grid-template-columns:1fr}}@media(max-width:700px){.reasons{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <a class="brand" href="index.html"><div class="logo"><span></span></div>QuantumHelper</a>
  <div class="top-meta"><span>任务判断</span><span class="mode"><i class="mode-dot"></i>任务引导</span></div>
</header>

<section class="hero">
  <div class="eyebrow">任务需要再整理</div>
  <h1>这个问题现在还不适合，<span class="hero-em">直接生成量子线路</span></h1>
  <p class="hero-text">不强行把所有问题包装成量子问题。先指出缺少什么，比生成一条看起来厉害但没有意义的线路更可靠。</p>
</section>
<main><section class="panel"><article class="card main"><div class="signal">!</div><h2>目前缺少可执行的问题结构</h2><p>例如目标不明确、没有候选范围，或者无法说明怎样判断一个结果“更好”。补齐这些信息后，QuantumHelper 才能继续判断是否适合量子方案。</p><div class="reasons"><div class="reason"><strong>目标还不够明确</strong><span>最好能说清最后希望得到什么结果。</span></div><div class="reason"><strong>缺少判断条件</strong><span>需要知道怎样区分满足条件和不满足条件。</span></div></div></article><aside class="card side-card"><div class="kicker">下一步</div><h2 class="side-title">先把任务说得更具体</h2><div class="action-block"><a class="btn primary" href="custom-task.html">返回补充任务 →</a><a class="btn secondary" href="index.html">返回首页</a></div></aside></section></main></div>
<script></script></body>
</html>
